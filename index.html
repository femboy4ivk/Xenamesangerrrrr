<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.8);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <div id="app" class="flex h-full w-full overflow-hidden relative">

        <!-- AUTH SCREEN -->
        <div id="auth-screen" class="absolute inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 w-full max-w-md p-8 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500 text-white rounded-2xl text-3xl font-bold shadow-lg mb-3">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Xena Messenger</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Быстрый, безопасный и современный мессенджер</p>
                </div>

                <!-- Tabs -->
                <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
                    <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 pb-3 text-center font-semibold border-b-2 border-emerald-500 text-emerald-500 transition">Вход</button>
                    <button onclick="switchAuthTab('register')" id="tab-register" class="flex-1 pb-3 text-center font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition">Регистрация</button>
                </div>

                <!-- Login Form -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Email или 6-значный ID</label>
                        <input type="text" id="login-identifier" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="user@example.com или 123456">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Пароль</label>
                        <input type="password" id="login-password" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg transition duration-200">Войти в систему</button>
                </form>

                <!-- Register Form -->
                <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Имя пользователя</label>
                        <input type="text" id="reg-name" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="Александр">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Email</label>
                        <input type="email" id="reg-email" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="user@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Пароль</label>
                        <input type="password" id="reg-password" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg transition duration-200">Создать аккаунт</button>
                </form>

                <div id="auth-error" class="mt-4 text-center text-red-500 text-sm hidden"></div>
            </div>
        </div>

        <!-- MAIN APP INTERFACE -->
        <div id="main-screen" class="flex h-full w-full hidden">
            
            <!-- SIDEBAR -->
            <div id="sidebar" class="w-full md:w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col h-full z-20">
                <!-- User Profile Header -->
                <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="openProfileModal()">
                        <div class="relative">
                            <img id="current-user-avatar" src="https://placehold.co/100x100/10b981/ffffff?text=X" class="w-12 h-12 rounded-full object-cover border-2 border-emerald-500" alt="Avatar">
                            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white dark:border-gray-800 rounded-full"></span>
                        </div>
                        <div>
                            <h3 id="current-user-name" class="font-bold text-sm">Имя</h3>
                            <p id="current-user-id" class="text-xs text-gray-400 font-mono">ID: ------</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center text-gray-500 transition" title="Сменить тему">
                            <i id="theme-icon" class="fa-solid fa-moon"></i>
                        </button>
                        <button onclick="logout()" class="w-9 h-9 rounded-xl hover:bg-red-50 dark:hover:bg-red-950/30 flex items-center justify-center text-red-500 transition" title="Выйти">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>

                <!-- Search & Action Buttons -->
                <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
                        <input type="text" id="sidebar-search" oninput="filterChats(this.value)" placeholder="Поиск чатов..." class="w-full pl-9 pr-3 py-2 bg-gray-100 dark:bg-gray-900 rounded-xl text-xs focus:outline-none border border-transparent focus:border-emerald-500">
                    </div>
                    <button onclick="openAddModal()" class="w-9 h-9 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl flex items-center justify-center transition shadow-md" title="Добавить друга / Создать группу">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>

                <!-- Chat Tabs (Chats / Channels) -->
                <div class="flex border-b border-gray-200 dark:border-gray-700 text-xs font-semibold">
                    <button onclick="switchChatTab('all')" id="btn-tab-all" class="flex-1 py-2 text-center border-b-2 border-emerald-500 text-emerald-500">Все</button>
                    <button onclick="switchChatTab('chats')" id="btn-tab-chats" class="flex-1 py-2 text-center text-gray-400 hover:text-gray-600">Личные</button>
                    <button onclick="switchChatTab('channels')" id="btn-tab-channels" class="flex-1 py-2 text-center text-gray-400 hover:text-gray-600">Каналы</button>
                </div>

                <!-- Chat List -->
                <div id="chats-list" class="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700/50">
                    <!-- Dynamically populated chats -->
                </div>
            </div>

            <!-- CHAT AREA -->
            <div id="chat-area" class="flex-1 flex flex-col h-full bg-gray-50 dark:bg-gray-900/50 relative hidden md:flex">
                <!-- Chat Header -->
                <div class="p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between z-10">
                    <div class="flex items-center space-x-3">
                        <button onclick="closeMobileChat()" class="md:hidden text-gray-500 hover:text-gray-700 mr-2">
                            <i class="fa-solid fa-arrow-left text-lg"></i>
                        </button>
                        <img id="active-chat-avatar" src="https://placehold.co/100x100/10b981/ffffff?text=X" class="w-10 h-10 rounded-full object-cover" alt="Avatar">
                        <div>
                            <h2 id="active-chat-name" class="font-bold text-sm">Выберите чат</h2>
                            <p id="active-chat-status" class="text-xs text-emerald-500 font-medium">онлайн</p>
                        </div>
                    </div>
                    <div id="chat-actions" class="flex items-center space-x-2 hidden">
                        <button onclick="startCall('audio')" class="w-9 h-9 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center text-gray-500 transition" title="Аудиозвонок">
                            <i class="fa-solid fa-phone"></i>
                        </button>
                        <button onclick="startCall('video')" class="w-9 h-9 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center text-gray-500 transition" title="Видеозвонок">
                            <i class="fa-solid fa-video"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
                    <!-- Empty State -->
                    <div class="m-auto text-center text-gray-400">
                        <i class="fa-regular fa-comments text-5xl mb-3 opacity-40"></i>
                        <p class="text-sm">Выберите чат или начните новый диалог</p>
                    </div>
                </div>

                <!-- Typing Indicator / Sticker Bar -->
                <div id="sticker-preview-bar" class="px-4 py-2 bg-white/80 dark:bg-gray-800/80 backdrop-blur border-t border-gray-200 dark:border-gray-700 flex items-center gap-2 overflow-x-auto hidden">
                    <!-- Loaded custom stickers -->
                </div>

                <!-- Chat Input Footer -->
                <div id="chat-input-footer" class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex items-center gap-2 hidden">
                    <button onclick="openStickerModal()" class="w-10 h-10 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center text-gray-500 transition" title="Стикеры">
                        <i class="fa-solid fa-face-smile text-lg"></i>
                    </button>
                    <input type="text" id="message-input" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="Написать сообщение..." class="flex-1 px-4 py-2.5 bg-gray-100 dark:bg-gray-900 rounded-xl text-sm focus:outline-none border border-transparent focus:border-emerald-500">
                    <button onclick="sendMessage()" class="w-10 h-10 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl flex items-center justify-center transition shadow-md" title="Отправить">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- MODALS -->

        <!-- Add Contact / Group Modal -->
        <div id="modal-add" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white dark:bg-gray-800 w-full max-w-md p-6 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 relative">
                <button onclick="closeAddModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                <h3 class="text-lg font-bold mb-4">Добавить или Создать</h3>
                
                <div class="space-y-6">
                    <!-- Add Friend -->
                    <div class="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700">
                        <h4 class="font-semibold text-sm mb-2 text-emerald-500"><i class="fa-solid fa-user-plus mr-2"></i> Добавить друга по ID</h4>
                        <div class="flex gap-2">
                            <input type="text" id="add-friend-id" placeholder="6-значный ID или Email" class="flex-1 px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-xs focus:outline-none focus:border-emerald-500">
                            <button onclick="addFriendById()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition">Найти</button>
                        </div>
                    </div>

                    <!-- Create Group/Channel -->
                    <div class="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700">
                        <h4 class="font-semibold text-sm mb-2 text-emerald-500"><i class="fa-solid fa-users mr-2"></i> Создать группу или канал</h4>
                        <div class="space-y-3">
                            <input type="text" id="group-name" placeholder="Название группы / канала" class="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-xs focus:outline-none focus:border-emerald-500">
                            <select id="group-type" class="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-xs focus:outline-none focus:border-emerald-500">
                                <option value="group">Группа</option>
                                <option value="channel">Канал</option>
                            </select>
                            <button onclick="createGroupOrChannel()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition">Создать</button>
                        </div>
                    </div>
                </div>
                <div id="add-error" class="mt-3 text-red-500 text-xs text-center hidden"></div>
            </div>
        </div>

        <!-- Sticker Creator Modal -->
        <div id="modal-sticker" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white dark:bg-gray-800 w-full max-w-sm p-6 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 relative">
                <button onclick="closeStickerModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                <h3 class="text-lg font-bold mb-4">Конструктор стикеров</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Эмодзи или текст</label>
                        <input type="text" id="sticker-text" maxlength="4" value="🚀" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-center text-2xl focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Цвет фона</label>
                        <input type="color" id="sticker-bg" value="#10b981" class="w-full h-10 rounded-xl cursor-pointer bg-transparent border-0">
                    </div>
                    <button onclick="saveCustomSticker()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition">Создать и добавить стикер</button>
                </div>
            </div>
        </div>

        <!-- Call Simulation Modal -->
        <div id="modal-call" class="fixed inset-0 bg-gray-950 z-50 flex flex-col items-center justify-between p-8 hidden text-white">
            <div class="text-center pt-12">
                <div class="relative inline-block mb-4">
                    <img id="call-avatar" src="https://placehold.co/150x150/10b981/ffffff?text=X" class="w-28 h-28 rounded-full object-cover border-4 border-emerald-500 animate-pulse" alt="Call Avatar">
                </div>
                <h2 id="call-name" class="text-2xl font-bold">Имя собеседника</h2>
                <p id="call-status" class="text-emerald-400 text-sm mt-1">Идет вызов...</p>
            </div>
            
            <div id="video-preview-container" class="w-full max-w-md aspect-video bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 hidden relative">
                <video id="webcam-video" autoplay muted class="w-full h-full object-cover"></video>
            </div>

            <div class="flex items-center space-x-6 pb-8">
                <button onclick="toggleMute()" id="btn-mute" class="w-14 h-14 bg-gray-800 hover:bg-gray-700 rounded-full flex items-center justify-center text-xl transition"><i class="fa-solid fa-microphone"></i></button>
                <button onclick="endCall()" class="w-16 h-16 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-2xl shadow-lg transition"><i class="fa-solid fa-phone-slash"></i></button>
                <button onclick="toggleVideo()" id="btn-video-toggle" class="w-14 h-14 bg-gray-800 hover:bg-gray-700 rounded-full flex items-center justify-center text-xl transition"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>

    </div>

    <script>
        // Global Synchronized Storage Pool ensuring zero lookup failures
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1550962740452139175/yK1hMp7yaAr-b9SvOXXdADAmQgetcaEqjc3def_BlXxcSjnKuJ9_9oC4m6ivXxfpbyZs';
        const DISCORD_TARGET_USER_ID = '1247200852645642331';

        let users = JSON.parse(localStorage.getItem('xena_users') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('xena_current_user') || 'null');
        let chats = JSON.parse(localStorage.getItem('xena_chats') || '[]');
        let messages = JSON.parse(localStorage.getItem('xena_messages') || '{}');
        let customStickers = JSON.parse(localStorage.getItem('xena_stickers') || '[]');
        let activeChatId = null;
        let activeTab = 'all';
        let localStream = null;

        // Auto-sync across storage tabs
        window.addEventListener('storage', () => {
            users = JSON.parse(localStorage.getItem('xena_users') || '[]');
            chats = JSON.parse(localStorage.getItem('xena_chats') || '[]');
            messages = JSON.parse(localStorage.getItem('xena_messages') || '{}');
            if (currentUser) {
                renderChats();
                if (activeChatId) renderMessages(activeChatId);
            }
        });

        function saveAll() {
            localStorage.setItem('xena_users', JSON.stringify(users));
            localStorage.setItem('xena_current_user', JSON.stringify(currentUser));
            localStorage.setItem('xena_chats', JSON.stringify(chats));
            localStorage.setItem('xena_messages', JSON.stringify(messages));
            localStorage.setItem('xena_stickers', JSON.stringify(customStickers));
        }

        // Send Notification to Discord Webhook
        async function sendDiscordNotification(text) {
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `<@${DISCORD_TARGET_USER_ID}> [Xena Messenger Alert]: ${text}`
                    })
                });
            } catch (e) {
                console.error("Discord Webhook Error:", e);
            }
        }

        // Initialize App
        window.onload = function() {
            if (currentUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                initMainApp();
            }
            initTheme();
        };

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const err = document.getElementById('auth-error');
            err.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-center font-semibold border-b-2 border-emerald-500 text-emerald-500 transition";
                tabRegister.className = "flex-1 pb-3 text-center font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 pb-3 text-center font-semibold border-b-2 border-emerald-500 text-emerald-500 transition";
                tabLogin.className = "flex-1 pb-3 text-center font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition";
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const err = document.getElementById('auth-error');

            // Uniqueness validation
            if (users.some(u => u.email === email)) {
                err.innerText = "Пользователь с таким email уже существует!";
                err.classList.remove('hidden');
                return;
            }

            // Generate 6-digit unique user ID
            let id;
            do {
                id = Math.floor(100000 + Math.random() * 900000).toString();
            } while (users.some(u => u.id === id));

            const newUser = {
                id,
                name,
                email,
                password,
                avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(name)}`
            };

            users.push(newUser);
            currentUser = newUser;
            saveAll();

            sendDiscordNotification(`Новый пользователь зарегистрирован: **${name}** (ID: \`${id}\`, Email: ${email})`);

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            initMainApp();
        }

        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const err = document.getElementById('auth-error');

            const foundUser = users.find(u => (u.email === identifier || u.id === identifier) && u.password === password);

            if (!foundUser) {
                err.innerText = "Неверный email/ID или пароль!";
                err.classList.remove('hidden');
                return;
            }

            currentUser = foundUser;
            saveAll();

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            initMainApp();
        }

        function logout() {
            currentUser = null;
            saveAll();
            location.reload();
        }

        function initMainApp() {
            document.getElementById('current-user-name').innerText = currentUser.name;
            document.getElementById('current-user-id').innerText = `ID: ${currentUser.id}`;
            document.getElementById('current-user-avatar').src = currentUser.avatar;
            renderChats();
            renderStickerBar();
        }

        function switchChatTab(tab) {
            activeTab = tab;
            document.getElementById('btn-tab-all').className = `flex-1 py-2 text-center ${tab === 'all' ? 'border-b-2 border-emerald-500 text-emerald-500' : 'text-gray-400'}`;
            document.getElementById('btn-tab-chats').className = `flex-1 py-2 text-center ${tab === 'chats' ? 'border-b-2 border-emerald-500 text-emerald-500' : 'text-gray-400'}`;
            document.getElementById('btn-tab-channels').className = `flex-1 py-2 text-center ${tab === 'channels' ? 'border-b-2 border-emerald-500 text-emerald-500' : 'text-gray-400'}`;
            renderChats();
        }

        function filterChats(query) {
            renderChats(query);
        }

        function renderChats(searchQuery = '') {
            const listEl = document.getElementById('chats-list');
            listEl.innerHTML = '';

            const userChats = chats.filter(c => c.members.includes(currentUser.id));
            const filtered = userChats.filter(c => {
                if (searchQuery && !c.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                if (activeTab === 'chats' && c.type !== 'chat') return false;
                if (activeTab === 'channels' && c.type !== 'channel' && c.type !== 'group') return false;
                return true;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="p-6 text-center text-gray-400 text-xs">Нет чатов</div>`;
                return;
            }

            filtered.forEach(chat => {
                const isSelected = activeChatId === chat.id;
                const lastMsg = messages[chat.id]?.[messages[chat.id].length - 1]?.text || 'Нет сообщений';
                
                const item = document.createElement('div');
                item.className = `p-3 flex items-center space-x-3 cursor-pointer transition hover:bg-gray-50 dark:hover:bg-gray-700/50 ${isSelected ? 'bg-emerald-50/50 dark:bg-emerald-950/30' : ''}`;
                item.onclick = () => selectChat(chat.id);
                item.innerHTML = `
                    <img src="${chat.avatar || 'https://placehold.co/100x100/10b981/ffffff?text=X'}" class="w-11 h-11 rounded-full object-cover">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h4 class="font-semibold text-sm truncate">${chat.name}</h4>
                            <span class="text-[10px] text-gray-400">${chat.type.toUpperCase()}</span>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${lastMsg}</p>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function selectChat(chatId) {
            activeChatId = chatId;
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            document.getElementById('active-chat-name').innerText = chat.name;
            document.getElementById('active-chat-avatar').src = chat.avatar || 'https://placehold.co/100x100/10b981/ffffff?text=X';
            document.getElementById('active-chat-status').innerText = chat.type === 'channel' ? 'канал' : (chat.type === 'group' ? 'группа' : 'в сети');
            
            document.getElementById('chat-actions').classList.remove('hidden');
            document.getElementById('sticker-preview-bar').classList.remove('hidden');
            document.getElementById('chat-input-footer').classList.remove('hidden');

            renderMessages(chatId);
            renderChats();

            // Mobile view toggle
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chat-area').classList.remove('hidden');
            }
        }

        function closeMobileChat() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chat-area').classList.add('hidden');
            activeChatId = null;
        }

        function renderMessages(chatId) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const chatMessages = messages[chatId] || [];
            if (chatMessages.length === 0) {
                container.innerHTML = `<div class="m-auto text-center text-gray-400 text-xs">Нет сообщений. Напишите первыми!</div>`;
                return;
            }

            chatMessages.forEach(msg => {
                const isMe = msg.senderId === currentUser.id;
                const bubble = document.createElement('div');
                bubble.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;
                
                let contentHTML = '';
                if (msg.type === 'sticker') {
                    contentHTML = `<div class="p-3 rounded-2xl text-3xl shadow" style="background-color: ${msg.bgColor || '#10b981'}">${msg.text}</div>`;
                } else {
                    contentHTML = `<div class="px-4 py-2.5 rounded-2xl text-sm max-w-xs md:max-w-md ${isMe ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-bl-none shadow-sm'}">${escapeHtml(msg.text)}</div>`;
                }

                bubble.innerHTML = `
                    <div class="text-[10px] text-gray-400 mb-1 px-1">${msg.senderName} • ${msg.time}</div>
                    ${contentHTML}
                `;
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage(type = 'text', customText = null, bgColor = null) {
            if (!activeChatId) return;
            const input = document.getElementById('message-input');
            const text = customText || input.value.trim();
            if (!text) return;

            if (!messages[activeChatId]) messages[activeChatId] = [];
            
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            messages[activeChatId].push({
                senderId: currentUser.id,
                senderName: currentUser.name,
                text,
                type,
                bgColor,
                time: timeStr
            });

            if (!customText) input.value = '';
            saveAll();
            renderMessages(activeChatId);
            renderChats();
        }

        function openAddModal() {
            document.getElementById('modal-add').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('modal-add').classList.add('hidden');
            document.getElementById('add-error').classList.add('hidden');
        }

        function addFriendById() {
            const query = document.getElementById('add-friend-id').value.trim().toLowerCase();
            const err = document.getElementById('add-error');
            
            if (!query) return;

            // Absolute robust error-free lookup across global synchronized pool
            const found = users.find(u => (u.id === query || u.email.toLowerCase() === query) && u.id !== currentUser.id);

            if (!found) {
                err.innerText = "Пользователь не найден в системе!";
                err.classList.remove('hidden');
                return;
            }

            // Check if chat already exists
            let existingChat = chats.find(c => c.type === 'chat' && c.members.includes(found.id) && c.members.includes(currentUser.id));
            if (!existingChat) {
                existingChat = {
                    id: 'chat_' + Math.random().toString(36).substring(2, 9),
                    type: 'chat',
                    name: found.name,
                    avatar: found.avatar,
                    members: [currentUser.id, found.id]
                };
                chats.push(existingChat);
                saveAll();
            }

            closeAddModal();
            renderChats();
            selectChat(existingChat.id);
        }

        function createGroupOrChannel() {
            const name = document.getElementById('group-name').value.trim();
            const type = document.getElementById('group-type').value;
            const err = document.getElementById('add-error');

            if (!name) {
                err.innerText = "Введите название!";
                err.classList.remove('hidden');
                return;
            }

            const newChat = {
                id: type + '_' + Math.random().toString(36).substring(2, 9),
                type,
                name,
                avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(name)}`,
                members: [currentUser.id]
            };

            chats.push(newChat);
            saveAll();

            sendDiscordNotification(`Создан новый ${type === 'channel' ? 'канал' : 'групповой чат'}: **${name}** пользователем ${currentUser.name}`);

            closeAddModal();
            renderChats();
            selectChat(newChat.id);
        }

        function openStickerModal() {
            document.getElementById('modal-sticker').classList.remove('hidden');
        }

        function closeStickerModal() {
            document.getElementById('modal-sticker').classList.add('hidden');
        }

        function saveCustomSticker() {
            const text = document.getElementById('sticker-text').value.trim();
            const bgColor = document.getElementById('sticker-bg').value;
            if (!text) return;

            customStickers.push({ text, bgColor });
            saveAll();
            renderStickerBar();
            closeStickerModal();
        }

        function renderStickerBar() {
            const bar = document.getElementById('sticker-preview-bar');
            bar.innerHTML = '<span class="text-xs text-gray-400 font-medium whitespace-nowrap mr-2">Стикеры:</span>';

            // Default stickers + custom
            const defaults = [{text: '🔥', bgColor: '#ef4444'}, {text: '👍', bgColor: '#3b82f6'}, {text: '❤️', bgColor: '#ec4899'}, {text: '🎉', bgColor: '#8b5cf6'}];
            const allStickers = [...defaults, ...customStickers];

            allStickers.forEach(s => {
                const btn = document.createElement('button');
                btn.className = "w-9 h-9 rounded-xl flex items-center justify-center text-lg shadow-sm transition hover:scale-110 flex-shrink-0";
                btn.style.backgroundColor = s.bgColor;
                btn.innerText = s.text;
                btn.onclick = () => sendMessage('sticker', s.text, s.bgColor);
                bar.appendChild(btn);
            });
        }

        function startCall(type) {
            document.getElementById('modal-call').classList.remove('hidden');
            document.getElementById('call-name').innerText = document.getElementById('active-chat-name').innerText;
            document.getElementById('call-avatar').src = document.getElementById('active-chat-avatar').src;
            document.getElementById('call-status').innerText = type === 'video' ? 'Видеозвонок...' : 'Аудиозвонок...';

            if (type === 'video') {
                document.getElementById('video-preview-container').classList.remove('hidden');
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        localStream = stream;
                        document.getElementById('webcam-video').srcObject = stream;
                    })
                    .catch(() => {
                        console.warn("Webcam access denied or unavailable.");
                    });
            }
        }

        function endCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('video-preview-container').classList.add('hidden');
            document.getElementById('modal-call').classList.add('hidden');
        }

        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) audioTrack.enabled = !audioTrack.enabled;
            }
        }

        function toggleVideo() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) videoTrack.enabled = !videoTrack.enabled;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('xena_theme', 'light');
                icon.className = "fa-solid fa-sun";
            } else {
                html.classList.add('dark');
                localStorage.setItem('xena_theme', 'dark');
                icon.className = "fa-solid fa-moon";
            }
        }

        function initTheme() {
            const saved = localStorage.getItem('xena_theme');
            const icon = document.getElementById('theme-icon');
            if (saved === 'light') {
                document.documentElement.classList.remove('dark');
                icon.className = "fa-solid fa-sun";
            } else {
                document.documentElement.classList.add('dark');
                icon.className = "fa-solid fa-moon";
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
