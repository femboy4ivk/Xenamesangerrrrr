<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased overflow-hidden">

    <div id="app" class="h-full w-full flex flex-col">
        <!-- Rendered dynamically via JavaScript -->
    </div>

    <script>
        // --- STORAGE & STATE MANAGEMENT ---
        const DB = {
            getUsers() {
                try {
                    return JSON.parse(localStorage.getItem('xena_users')) || [];
                } catch (e) { return []; }
            },
            saveUsers(users) {
                localStorage.setItem('xena_users', JSON.stringify(users));
            },
            getCurrentUser() {
                try {
                    return JSON.parse(localStorage.getItem('xena_current_user')) || null;
                } catch (e) { return null; }
            },
            setCurrentUser(user) {
                if (user) {
                    localStorage.setItem('xena_current_user', JSON.stringify(user));
                } else {
                    localStorage.removeItem('xena_current_user');
                }
            },
            getMessages() {
                try {
                    return JSON.parse(localStorage.getItem('xena_messages')) || [];
                } catch (e) { return []; }
            },
            saveMessages(messages) {
                localStorage.setItem('xena_messages', JSON.stringify(messages));
            },
            updateUser(updatedUser) {
                let users = this.getUsers();
                users = users.map(u => u.id === updatedUser.id ? updatedUser : u);
                this.saveUsers(users);
                const curr = this.getCurrentUser();
                if (curr && curr.id === updatedUser.id) {
                    this.setCurrentUser(updatedUser);
                }
            }
        };

        // Poll for cross-tab storage changes (syncing real-time updates between different browsers/tabs)
        window.addEventListener('storage', (e) => {
            if (['xena_users', 'xena_messages', 'xena_current_user'].includes(e.key)) {
                renderApp();
            }
        });

        // Periodic check for database updates to keep tabs in sync even if storage event misses
        setInterval(() => {
            const currentUser = DB.getCurrentUser();
            if (currentUser) {
                const users = DB.getUsers();
                const freshUser = users.find(u => u.id === currentUser.id);
                if (freshUser && JSON.stringify(freshUser) !== JSON.stringify(currentUser)) {
                    DB.setCurrentUser(freshUser);
                    renderApp();
                } else {
                    // Check if message count changed
                    const messages = DB.getMessages();
                    const lastMsgCount = window._lastMsgCount || 0;
                    if (messages.length !== lastMsgCount) {
                        window._lastMsgCount = messages.length;
                        renderApp();
                    }
                }
            }
        }, 1000);

        let activeTab = 'chats'; // 'chats', 'search', 'requests', 'profile'
        let activeChatUserId = null;
        let authMode = 'login'; // 'login' or 'register'
        let notificationMessage = null;

        function showNotification(msg, type = 'success') {
            notificationMessage = { text: msg, type };
            renderApp();
            setTimeout(() => {
                if (notificationMessage && notificationMessage.text === msg) {
                    notificationMessage = null;
                    renderApp();
                }
            }, 3500);
        }

        // --- RENDER ROUTER ---
        function renderApp() {
            const app = document.getElementById('app');
            const currentUser = DB.getCurrentUser();

            if (!currentUser) {
                app.innerHTML = renderAuthScreen();
                attachAuthListeners();
                return;
            }

            // Main Layout with Sidebar + Main Content Area
            app.innerHTML = `
                ${notificationMessage ? renderToast(notificationMessage) : ''}
                <div class="flex h-full w-full overflow-hidden relative">
                    <!-- Sidebar Navigation -->
                    <aside class="w-20 md:w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between shrink-0 z-20">
                        <!-- Sidebar Header & Nav -->
                        <div class="flex flex-col h-full">
                            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white font-bold text-lg shadow-md shrink-0">
                                        ${currentUser.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="hidden md:block truncate">
                                        <h2 class="font-semibold text-sm truncate">${escapeHtml(currentUser.name)}</h2>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate">@${escapeHtml(currentUser.username || currentUser.email)}</p>
                                    </div>
                                </div>
                                <button onclick="handleLogout()" title="Выйти" class="hidden md:flex text-slate-400 hover:text-red-500 transition p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </button>
                            </div>

                            <!-- Navigation Tabs -->
                            <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
                                <button onclick="switchTab('chats')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'chats' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-comments text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Чаты</span>
                                </button>
                                <button onclick="switchTab('search')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'search' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-user-plus text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Найти людей</span>
                                </button>
                                <button onclick="switchTab('requests')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition relative ${activeTab === 'requests' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-bell text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Заявки в друзья</span>
                                    ${(currentUser.friendRequests && currentUser.friendRequests.length > 0) ? `
                                        <span class="absolute right-3 top-3 md:static bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">${currentUser.friendRequests.length}</span>
                                    ` : ''}
                                </button>
                                <button onclick="switchTab('profile')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'profile' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-user-gear text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Профиль</span>
                                </button>
                            </nav>
                        </div>

                        <!-- Mobile Logout -->
                        <div class="p-3 border-t border-slate-200 dark:border-slate-800 md:hidden flex justify-center">
                            <button onclick="handleLogout()" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl">
                                <i class="fa-solid fa-right-from-bracket text-lg"></i>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Workspace Area -->
                    <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-900 overflow-hidden">
                        ${renderMainContent(currentUser)}
                    </main>
                </div>
            `;

            attachEventListeners(currentUser);
        }

        // --- AUTH SCREENS ---
        function renderAuthScreen() {
            return `
                <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-950 dark:to-slate-900 p-4">
                    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-brand-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-brand-500/30 mb-4">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight">Xena Messenger</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Реальное общение между зарегистрированными пользователями</p>
                        </div>

                        <!-- Mode Switcher -->
                        <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl mb-6">
                            <button onclick="setAuthMode('login')" class="flex-1 py-2 text-sm font-medium rounded-lg transition ${authMode === 'login' ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">
                                Вход
                            </button>
                            <button onclick="setAuthMode('register')" class="flex-1 py-2 text-sm font-medium rounded-lg transition ${authMode === 'register' ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">
                                Регистрация
                            </button>
                        </div>

                        <form id="auth-form" class="space-y-4" onsubmit="handleAuthSubmit(event)">
                            ${authMode === 'register' ? `
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Имя</label>
                                    <input type="text" id="auth-name" required placeholder="Ваше имя" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Логин (@username)</label>
                                    <input type="text" id="auth-username" required placeholder="example_user" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Email / Логин</label>
                                <input type="text" id="auth-email" required placeholder="user@example.com или логин" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Пароль</label>
                                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition">
                            </div>

                            <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 transition mt-2">
                                ${authMode === 'login' ? 'Войти' : 'Зарегистрироваться'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function setAuthMode(mode) {
            authMode = mode;
            renderApp();
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            let users = DB.getUsers();

            if (authMode === 'register') {
                const name = document.getElementById('auth-name').value.trim();
                const username = document.getElementById('auth-username').value.trim().replace(/^@/, '');

                if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                    showNotification('Пользователь с таким логином уже существует!', 'error');
                    return;
                }

                if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                    showNotification('Этот email уже зарегистрирован!', 'error');
                    return;
                }

                const newUser = {
                    id: 'user_' + Date.now() + Math.random().toString(36).substr(2, 5),
                    name,
                    username,
                    email,
                    password,
                    bio: 'Привет! Я пользуюсь Xena Messenger.',
                    friends: [], // array of user IDs
                    friendRequests: [], // array of user IDs who sent requests
                    sentRequests: [] // array of user IDs to whom requests were sent
                };

                users.push(newUser);
                DB.saveUsers(users);
                DB.setCurrentUser(newUser);
                showNotification('Регистрация прошла успешно!');
                renderApp();
            } else {
                const user = users.find(u => (u.email.toLowerCase() === email.toLowerCase() || u.username.toLowerCase() === email.toLowerCase().replace(/^@/, '')) && u.password === password);
                if (user) {
                    DB.setCurrentUser(user);
                    showNotification('Добро пожаловать, ' + user.name + '!');
                    renderApp();
                } else {
                    showNotification('Неверный логин или пароль', 'error');
                }
            }
        }

        function handleLogout() {
            DB.setCurrentUser(null);
            activeChatUserId = null;
            activeTab = 'chats';
            showNotification('Вы вышли из системы');
            renderApp();
        }

        // --- MAIN CONTENT ROUTER ---
        function renderMainContent(currentUser) {
            // Ensure friend lists are arrays
            currentUser.friends = currentUser.friends || [];
            currentUser.friendRequests = currentUser.friendRequests || [];
            currentUser.sentRequests = currentUser.sentRequests || [];

            if (activeTab === 'search') {
                return renderSearchTab(currentUser);
            } else if (activeTab === 'requests') {
                return renderRequestsTab(currentUser);
            } else if (activeTab === 'profile') {
                return renderProfileTab(currentUser);
            } else {
                // Chats tab (Split view: chat list left, active chat right)
                return `
                    <div class="flex h-full w-full overflow-hidden">
                        <!-- Chat List Sidebar -->
                        <div class="${activeChatUserId ? 'hidden md:flex' : 'flex'} w-full md:w-80 lg:w-96 flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
                            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                <h2 class="font-bold text-lg">Чаты</h2>
                                <span class="text-xs bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 px-2.5 py-1 rounded-full font-medium">
                                    ${currentUser.friends.length} друзей
                                </span>
                            </div>
                            <div class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/60">
                                ${currentUser.friends.length === 0 ? `
                                    <div class="p-8 text-center text-slate-400">
                                        <i class="fa-solid fa-user-group text-4xl mb-3 opacity-50"></i>
                                        <p class="text-sm font-medium">У вас пока нет друзей в чатах</p>
                                        <p class="text-xs mt-1">Найдите пользователей во вкладке "Найти людей"</p>
                                        <button onclick="switchTab('search')" class="mt-4 px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white text-xs font-semibold rounded-xl shadow transition">
                                            Найти друзей
                                        </button>
                                    </div>
                                ` : currentUser.friends.map(friendId => {
                                    const users = DB.getUsers();
                                    const friend = users.find(u => u.id === friendId);
                                    if (!friend) return '';
                                    const isSelected = activeChatUserId === friend.id;
                                    const lastMsg = getLastMessage(currentUser.id, friend.id);
                                    return `
                                        <div onclick="openChat('${friend.id}')" class="flex items-center space-x-3 p-4 cursor-pointer transition hover:bg-slate-50 dark:hover:bg-slate-800/50 ${isSelected ? 'bg-slate-100 dark:bg-slate-800' : ''}">
                                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white font-bold shrink-0 shadow">
                                                ${friend.name.charAt(0).toUpperCase()}
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex items-center justify-between mb-1">
                                                    <h3 class="font-semibold text-sm truncate">${escapeHtml(friend.name)}</h3>
                                                    ${lastMsg ? `<span class="text-[10px] text-slate-400">${formatTime(lastMsg.timestamp)}</span>` : ''}
                                                </div>
                                                <p class="text-xs text-slate-500 dark:text-slate-400 truncate">
                                                    ${lastMsg ? escapeHtml(lastMsg.text) : '@' + escapeHtml(friend.username)}
                                                </p>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Active Chat Window -->
                        <div class="${!activeChatUserId ? 'hidden md:flex' : 'flex'} flex-1 flex-col h-full bg-slate-50 dark:bg-slate-950 overflow-hidden">
                            ${activeChatUserId ? renderChatWindow(currentUser, activeChatUserId) : `
                                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-400">
                                    <div class="w-20 h-20 bg-slate-200 dark:bg-slate-800 rounded-3xl flex items-center justify-center text-3xl text-slate-400 mb-4 shadow-inner">
                                        <i class="fa-solid fa-comments"></i>
                                    </div>
                                    <h3 class="font-semibold text-lg text-slate-700 dark:text-slate-300">Выберите чат</h3>
                                    <p class="text-sm max-w-sm mt-1">Выберите друга из списка слева, чтобы начать диалог или найдите нового пользователя.</p>
                                </div>
                            `}
                        </div>
                    </div>
                `;
        }

        // --- SEARCH TAB ---
        function renderSearchTab(currentUser) {
            const allUsers = DB.getUsers().filter(u => u.id !== currentUser.id);
            const searchQuery = window._searchQuery || '';
            
            const filteredUsers = allUsers.filter(u => 
                u.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                u.username.toLowerCase().includes(searchQuery.toLowerCase()) ||
                u.email.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return `
                <div class="flex flex-col h-full overflow-hidden">
                    <div class="p-6 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
                        <h2 class="font-bold text-xl mb-4">Поиск пользователей</h2>
                        <div class="relative">
                            <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                            <input type="text" id="user-search-input" value="${escapeHtml(searchQuery)}" oninput="handleSearchInput(event)" placeholder="Введите имя или @логин пользователя..." class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:border-brand-500 transition text-sm">
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-5xl mx-auto">
                            ${filteredUsers.length === 0 ? `
                                <div class="col-span-full py-12 text-center text-slate-400">
                                    <i class="fa-solid fa-user-slash text-4xl mb-3 opacity-50"></i>
                                    <p class="font-medium">Пользователи не найдены</p>
                                    <p class="text-xs mt-1">Попробуйте ввести другой запрос или зарегистрировать аккаунт в другом браузере.</p>
                                </div>
                            ` : filteredUsers.map(user => {
                                const isFriend = currentUser.friends.includes(user.id);
                                const hasSentRequest = currentUser.sentRequests && currentUser.sentRequests.includes(user.id);
                                const hasReceivedRequest = currentUser.friendRequests && currentUser.friendRequests.includes(user.id);

                                let actionBtn = '';
                                if (isFriend) {
                                    actionBtn = `<button onclick="openChat('${user.id}')" class="px-4 py-2 bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 font-medium text-xs rounded-xl hover:bg-brand-200 transition"><i class="fa-solid fa-comment mr-1.5"></i> Написать</button>`;
                                } else if (hasSentRequest) {
                                    actionBtn = `<span class="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-500 text-xs font-medium rounded-xl">Заявка отправлена</span>`;
                                } else if (hasReceivedRequest) {
                                    actionBtn = `<button onclick="switchTab('requests')" class="px-4 py-2 bg-amber-500 text-white font-medium text-xs rounded-xl shadow hover:bg-amber-600 transition"><i class="fa-solid fa-bell mr-1.5"></i> Ответить на заявку</button>`;
                                } else {
                                    actionBtn = `<button onclick="sendFriendRequest('${user.id}')" class="px-4 py-2 bg-brand-500 text-white font-medium text-xs rounded-xl shadow-md shadow-brand-500/20 hover:bg-brand-600 transition"><i class="fa-solid fa-user-plus mr-1.5"></i> Добавить в друзья</button>`;
                                }

                                return `
                                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-sm">
                                        <div class="flex items-center space-x-3 mb-4">
                                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white font-bold shrink-0 shadow">
                                                ${user.name.charAt(0).toUpperCase()}
                                            </div>
                                            <div class="min-w-0">
                                                <h3 class="font-semibold text-sm truncate">${escapeHtml(user.name)}</h3>
                                                <p class="text-xs text-slate-500 dark:text-slate-400 truncate">@${escapeHtml(user.username)}</p>
                                            </div>
                                        </div>
                                        <p class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2 mb-4 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl">
                                            ${escapeHtml(user.bio || 'Нет статуса')}
                                        </p>
                                        <div class="flex justify-end">
                                            ${actionBtn}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSearchInput(e) {
            window._searchQuery = e.target.value;
        }

        // --- FRIEND REQUEST ACTIONS ---
        function sendFriendRequest(targetUserId) {
            let users = DB.getUsers();
            let currentUser = DB.getCurrentUser();

            const targetUser = users.find(u => u.id === targetUserId);
            if (!targetUser) {
                showNotification('Пользователь не найден', 'error');
                return;
            }

            // Update target user's incoming requests
            targetUser.friendRequests = targetUser.friendRequests || [];
            if (!targetUser.friendRequests.includes(currentUser.id)) {
                targetUser.friendRequests.push(currentUser.id);
            }

            // Update current user's sent requests
            currentUser.sentRequests = currentUser.sentRequests || [];
            if (!currentUser.sentRequests.includes(targetUser.id)) {
                currentUser.sentRequests.push(targetUser.id);
            }

            DB.updateUser(targetUser);
            DB.updateUser(currentUser);

            showNotification('Заявка в друзья отправлена пользователю ' + targetUser.name + '!');
            renderApp();
        }

        // --- REQUESTS TAB ---
        function renderRequestsTab(currentUser) {
            const requests = currentUser.friendRequests || [];

            return `
                <div class="flex flex-col h-full overflow-hidden">
                    <div class="p-6 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
                        <h2 class="font-bold text-xl">Заявки в друзья</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Пользователи, которые хотят добавить вас в друзья</p>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="max-w-3xl mx-auto space-y-4">
                            ${requests.length === 0 ? `
                                <div class="py-16 text-center text-slate-400">
                                    <i class="fa-solid fa-bell-slash text-4xl mb-3 opacity-50"></i>
                                    <p class="font-medium">Нет входящих заявок</p>
                                    <p class="text-xs mt-1">Когда другой зарегистрированный пользователь отправит вам заявку, она появится здесь.</p>
                                </div>
                            ` : requests.map(senderId => {
                                const users = DB.getUsers();
                                const sender = users.find(u => u.id === senderId);
                                if (!sender) return '';

                                return `
                                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex items-center justify-between shadow-sm">
                                        <div class="flex items-center space-x-4">
                                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white font-bold shrink-0 shadow">
                                                ${sender.name.charAt(0).toUpperCase()}
                                            </div>
                                            <div>
                                                <h3 class="font-semibold text-sm">${escapeHtml(sender.name)}</h3>
                                                <p class="text-xs text-slate-500 dark:text-slate-400">@${escapeHtml(sender.username)}</p>
                                                <p class="text-xs text-slate-600 dark:text-slate-300 mt-1">${escapeHtml(sender.bio || '')}</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <button onclick="acceptFriendRequest('${sender.id}')" class="px-4 py-2 bg-brand-500 text-white font-medium text-xs rounded-xl shadow hover:bg-brand-600 transition">
                                                <i class="fa-solid fa-check mr-1"></i> Принять
                                            </button>
                                            <button onclick="rejectFriendRequest('${sender.id}')" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium text-xs rounded-xl hover:bg-slate-300 transition">
                                                <i class="fa-solid fa-xmark mr-1"></i> Отклонить
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function acceptFriendRequest(senderId) {
            let users = DB.getUsers();
            let currentUser = DB.getCurrentUser();
            const sender = users.find(u => u.id === senderId);

            if (!sender) {
                showNotification('Пользователь не найден', 'error');
                return;
            }

            // Add each other to friends
            currentUser.friends = currentUser.friends || [];
            if (!currentUser.friends.includes(sender.id)) currentUser.friends.push(sender.id);

            sender.friends = sender.friends || [];
            if (!sender.friends.includes(currentUser.id)) sender.friends.push(currentUser.id);

            // Remove request
            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            sender.sentRequests = (sender.sentRequests || []).filter(id => id !== currentUser.id);

            DB.updateUser(currentUser);
            DB.updateUser(sender);

            showNotification('Вы добавили ' + sender.name + ' в друзья!');
            activeChatUserId = sender.id;
            activeTab = 'chats';
            renderApp();
        }

        function rejectFriendRequest(senderId) {
            let users = DB.getUsers();
            let currentUser = DB.getCurrentUser();
            const sender = users.find(u => u.id === senderId);

            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            if (sender) {
                sender.sentRequests = (sender.sentRequests || []).filter(id => id !== currentUser.id);
                DB.updateUser(sender);
            }

            DB.updateUser(currentUser);
            showNotification('Заявка отклонена');
            renderApp();
        }

        // --- PROFILE TAB ---
        function renderProfileTab(currentUser) {
            return `
                <div class="flex flex-col h-full overflow-hidden">
                    <div class="p-6 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
                        <h2 class="font-bold text-xl">Настройки профиля</h2>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                            <form onsubmit="handleProfileUpdate(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Имя</label>
                                    <input type="text" id="profile-name" value="${escapeHtml(currentUser.name)}" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 transition text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Логин (@username)</label>
                                    <input type="text" id="profile-username" value="${escapeHtml(currentUser.username)}" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 transition text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">О себе (статус)</label>
                                    <textarea id="profile-bio" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 transition text-sm">${escapeHtml(currentUser.bio || '')}</textarea>
                                </div>
                                <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 transition">
                                    Сохранить изменения
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleProfileUpdate(e) {
            e.preventDefault();
            let currentUser = DB.getCurrentUser();
            currentUser.name = document.getElementById('profile-name').value.trim();
            currentUser.username = document.getElementById('profile-username').value.trim().replace(/^@/, '');
            currentUser.bio = document.getElementById('profile-bio').value.trim();

            DB.updateUser(currentUser);
            showNotification('Профиль успешно обновлен!');
            renderApp();
        }

        // --- ACTIVE CHAT WINDOW ---
        function renderChatWindow(currentUser, friendId) {
            const users = DB.getUsers();
            const friend = users.find(u => u.id === friendId);
            if (!friend) return '';

            const messages = getConversationMessages(currentUser.id, friend.id);

            return `
                <div class="flex flex-col h-full bg-white dark:bg-slate-900">
                    <!-- Chat Header -->
                    <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <button onclick="closeActiveChat()" class="md:hidden text-slate-500 hover:text-slate-800 dark:hover:text-white p-2">
                                <i class="fa-solid fa-arrow-left text-lg"></i>
                            </button>
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white font-bold shadow">
                                ${friend.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h3 class="font-semibold text-sm">${escapeHtml(friend.name)}</h3>
                                <p class="text-xs text-slate-500">@${escapeHtml(friend.username)}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Messages Container -->
                    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50 dark:bg-slate-950/50">
                        ${messages.length === 0 ? `
                            <div class="h-full flex flex-col items-center justify-center text-center text-slate-400">
                                <i class="fa-regular fa-paper-plane text-3xl mb-2 opacity-50"></i>
                                <p class="text-sm font-medium">Здесь начнется история вашего диалога</p>
                                <p class="text-xs">Напишите первое сообщение пользователю ${escapeHtml(friend.name)}</p>
                            </div>
                        ` : messages.map(msg => {
                            const isMe = msg.senderId === currentUser.id;
                            return `
                                <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                                    <div class="max-w-xs md:max-w-md rounded-2xl px-4 py-2.5 shadow-sm ${isMe ? 'bg-brand-500 text-white rounded-br-none' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-bl-none'}">
                                        <p class="text-sm break-words">${escapeHtml(msg.text)}</p>
                                        <div class="text-[10px] mt-1 text-right ${isMe ? 'text-brand-100' : 'text-slate-400'}">
                                            ${formatTime(msg.timestamp)}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Message Input Form -->
                    <form onsubmit="handleSendMessage(event, '${friend.id}')" class="p-3 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center space-x-2">
                        <input type="text" id="chat-input" placeholder="Введите сообщение..." autocomplete="off" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:border-brand-500 transition text-sm">
                        <button type="submit" class="w-12 h-12 bg-brand-500 hover:bg-brand-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-brand-500/20 transition shrink-0">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </div>
            `;
        }

        function openChat(friendId) {
            activeChatUserId = friendId;
            renderApp();
            scrollToBottom();
        }

        function closeActiveChat() {
            activeChatUserId = null;
            renderApp();
        }

        function handleSendMessage(e, recipientId) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const currentUser = DB.getCurrentUser();
            const newMessage = {
                id: 'msg_' + Date.now() + Math.random().toString(36).substr(2, 5),
                senderId: currentUser.id,
                recipientId: recipientId,
                text: text,
                timestamp: Date.now()
            };

            let messages = DB.getMessages();
            messages.push(newMessage);
            DB.saveMessages(messages);

            input.value = '';
            renderApp();
            scrollToBottom();
        }

        // --- HELPERS ---
        function switchTab(tab) {
            activeTab = tab;
            if (tab !== 'chats') {
                activeChatUserId = null;
            }
            renderApp();
        }

        function getConversationMessages(userId1, userId2) {
            const messages = DB.getMessages();
            return messages.filter(m => 
                (m.senderId === userId1 && m.recipientId === userId2) ||
                (m.senderId === userId2 && m.recipientId === userId1)
            ).sort((a, b) => a.timestamp - b.timestamp);
        }

        function getLastMessage(userId1, userId2) {
            const msgs = getConversationMessages(userId1, userId2);
            return msgs.length > 0 ? msgs[msgs.length - 1] : null;
        }

        function scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, 50);
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function renderToast(notification) {
            const bgClass = notification.type === 'error' ? 'bg-red-500' : 'bg-slate-900 dark:bg-slate-800 text-white';
            return `
                <div class="fixed top-5 right-5 z-50 ${bgClass} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 animate-bounce">
                    <i class="fa-solid ${notification.type === 'error' ? 'fa-circle-exclamation text-xl' : 'fa-circle-check text-brand-500 text-xl'}"></i>
                    <span class="text-sm font-medium">${escapeHtml(notification.text)}</span>
                </div>
            `;
        }

        function attachAuthListeners() {}
        function attachEventListeners(currentUser) {
            if (activeChatUserId) {
                scrollToBottom();
            }
        }

        // Initial render on load
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
