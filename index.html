<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased overflow-hidden transition-colors duration-200">

    <div id="app" class="h-full w-full flex flex-col items-center justify-center">
        <!-- Loading Screen -->
        <div class="animate-pulse flex flex-col items-center space-y-4">
            <div class="w-16 h-16 bg-brand-500 rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <p class="text-slate-500 font-medium" id="loading-text">Подключение к облаку...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'xena-messenger-v2';
        
        window.AppState = {
            db: null,
            auth: null,
            users: [],
            messages: [],
            groups: [],
            stickers: [
                { id: 'st_1', name: 'Огонь', url: 'https://placehold.co/120x120/22c55e/ffffff?text=🔥' },
                { id: 'st_2', name: 'Сердце', url: 'https://placehold.co/120x120/ef4444/ffffff?text=❤️' },
                { id: 'st_3', name: 'Смех', url: 'https://placehold.co/120x120/eab308/ffffff?text=😂' }
            ],
            currentUser: null,
            activeTab: 'chats',
            activeChatId: null,
            authMode: 'login',
            notificationMessage: null,
            isStickersOpen: false,
            linkQuery: '',
            setupError: null
        };

        // Utility Functions
        window.showNotification = (msg, type = 'success') => {
            window.AppState.notificationMessage = { text: msg, type };
            window.renderApp();
            setTimeout(() => {
                if (window.AppState.notificationMessage && window.AppState.notificationMessage.text === msg) {
                    window.AppState.notificationMessage = null;
                    window.renderApp();
                }
            }, 3500);
        };
        window.formatTime = (timestamp) => new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        window.escapeHtml = (str) => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        window.scrollToBottom = () => setTimeout(() => { const c = document.getElementById('messages-container'); if (c) c.scrollTop = c.scrollHeight; }, 50);

        async function initFirebase() {
            let configStr = localStorage.getItem('custom_firebase_config');
            
            if (!configStr && typeof __firebase_config !== 'undefined') {
                try {
                    const parsed = JSON.parse(__firebase_config);
                    if (parsed && parsed.apiKey && !parsed.apiKey.includes('demo')) {
                        configStr = __firebase_config;
                    }
                } catch(e) {}
            }

            if (!configStr) {
                renderSetupScreen("Конфигурация Firebase не найдена. Пожалуйста, настройте подключение.");
                return;
            }

            try {
                const firebaseConfig = JSON.parse(configStr);
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                window.AppState.db = db;
                window.AppState.auth = auth;

                // Auth
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                startDatabaseListeners(db);

            } catch (error) {
                console.error("Firebase Init Error:", error);
                renderSetupScreen("Ошибка подключения: " + error.message);
            }
        }

        const publicPath = (col) => collection(window.AppState.db, 'artifacts', appId, 'public', 'data', col);
        const publicDoc = (col, docId) => doc(window.AppState.db, 'artifacts', appId, 'public', 'data', col, String(docId));

        function startDatabaseListeners(db) {
            const savedId = localStorage.getItem('xena_saved_user_id');

            onSnapshot(publicPath('users'), (snapshot) => {
                const users = [];
                snapshot.forEach(doc => users.push(doc.data()));
                window.AppState.users = users;

                if (savedId && !window.AppState.currentUser) {
                    const user = users.find(u => u.id === savedId);
                    if (user) window.AppState.currentUser = user;
                } else if (window.AppState.currentUser) {
                    const freshUser = users.find(u => u.id === window.AppState.currentUser.id);
                    if (freshUser) window.AppState.currentUser = freshUser;
                }
                window.renderApp();
            }, (err) => console.error(err));

            onSnapshot(publicPath('messages'), (snapshot) => {
                const messages = [];
                snapshot.forEach(doc => messages.push({ ...doc.data(), docId: doc.id }));
                window.AppState.messages = messages;
                window.renderApp();
                window.scrollToBottom();
            }, (err) => console.error(err));

            onSnapshot(publicPath('groups'), (snapshot) => {
                const groups = [];
                snapshot.forEach(doc => groups.push(doc.data()));
                window.AppState.groups = groups;
                window.renderApp();
            }, (err) => console.error(err));

            onSnapshot(publicPath('stickers'), (snapshot) => {
                const cloudStickers = [];
                snapshot.forEach(doc => cloudStickers.push(doc.data()));
                const defaultIds = ['st_1', 'st_2', 'st_3'];
                window.AppState.stickers = [...window.AppState.stickers.filter(s => defaultIds.includes(s.id)), ...cloudStickers];
                window.renderApp();
            }, (err) => console.error(err));
        }

        window.saveFirebaseConfig = () => {
            const val = document.getElementById('fb-config-input').value.trim();
            if(!val) return;
            try {
                JSON.parse(val); // validate json
                localStorage.setItem('custom_firebase_config', val);
                window.location.reload();
            } catch(e) {
                alert("Ошибка: Неверный формат JSON.");
            }
        };

        window.clearFirebaseConfig = () => {
            localStorage.removeItem('custom_firebase_config');
            window.location.reload();
        };

        function renderSetupScreen(errorMsg) {
            document.getElementById('app').innerHTML = `
                <div class="h-full w-full bg-slate-100 dark:bg-slate-950 flex items-center justify-center p-4 overflow-y-auto">
                    <div class="max-w-2xl w-full bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-8 my-8">
                        <div class="flex items-center space-x-4 mb-6 text-red-500">
                            <div class="w-12 h-12 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Требуется настройка базы данных</h1>
                        </div>
                        
                        ${errorMsg ? `<div class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-4 rounded-xl mb-6 text-sm border border-red-100 dark:border-red-800/30">${errorMsg}</div>` : ''}
                        
                        <div class="prose dark:prose-invert max-w-none text-sm text-slate-600 dark:text-slate-300 mb-8 space-y-4">
                            <p>Для работы Xena Messenger требуется подключение к реальной базе данных (Firebase), чтобы ваши сообщения и стикеры сохранялись и были доступны с разных браузеров.</p>
                            
                            <h3 class="font-bold text-slate-900 dark:text-white text-base">Инструкция (5 минут):</h3>
                            <ol class="list-decimal pl-5 space-y-2">
                                <li>Перейдите на <a href="https://console.firebase.google.com/" target="_blank" class="text-brand-500 hover:underline">console.firebase.google.com</a> и создайте новый проект.</li>
                                <li>В меню слева выберите <strong>Build &gt; Firestore Database</strong> и нажмите <strong>Create database</strong> (выберите Test Mode).</li>
                                <li>В меню выберите <strong>Build &gt; Authentication</strong>, нажмите <strong>Get Started</strong>, выберите провайдер <strong>Anonymous</strong> и включите его (Enable).</li>
                                <li>Вернитесь на главный экран проекта (шестеренка &gt; Project settings). Прокрутите вниз и добавьте веб-приложение (иконка <code>&lt;/&gt;</code>).</li>
                                <li>Скопируйте объект <code>firebaseConfig</code> (только то, что внутри фигурных скобок <code>{ ... }</code>, включая сами скобки).</li>
                                <li>Вставьте этот JSON код в поле ниже и нажмите "Сохранить и запустить".</li>
                            </ol>
                        </div>

                        <div class="space-y-4">
                            <label class="block text-sm font-semibold text-slate-900 dark:text-white">Ваш Firebase Config (JSON формат):</label>
                            <textarea id="fb-config-input" rows="6" class="w-full font-mono text-xs p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:border-brand-500 transition shadow-inner" placeholder='{\n  "apiKey": "AIzaSy...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app",\n  "storageBucket": "your-app.appspot.com",\n  "messagingSenderId": "123456789",\n  "appId": "1:123456:web:abcde"\n}'></textarea>
                            
                            <div class="flex space-x-3">
                                <button onclick="saveFirebaseConfig()" class="flex-1 py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 transition">
                                    Сохранить и запустить
                                </button>
                                <button onclick="clearFirebaseConfig()" class="px-6 py-3 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 transition">
                                    Сбросить
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.DB = {
            getNextUserId() {
                const users = window.AppState.users;
                if (users.length === 0) return '0000000001';
                let maxId = 0;
                users.forEach(u => {
                    const num = parseInt(u.id, 10);
                    if (!isNaN(num) && num > maxId) maxId = num;
                });
                return String(maxId + 1).padStart(10, '0');
            },
            async registerUser(name, email, password) {
                const newId = this.getNextUserId();
                const newUser = {
                    id: newId,
                    name,
                    email,
                    password, // Mock auth
                    bio: 'Привет! Мой ID в Xena: ' + newId,
                    avatar: '',
                    darkMode: false,
                    friends: [],
                    friendRequests: [],
                    sentRequests: []
                };
                try {
                    await setDoc(publicDoc('users', newId), newUser);
                    window.AppState.currentUser = newUser;
                    localStorage.setItem('xena_saved_user_id', newId);
                    window.showNotification('Успешно! Ваш ID: ' + newId);
                    window.renderApp();
                } catch (e) {
                    window.showNotification('Ошибка регистрации', 'error');
                }
            },
            async updateUser(userObj) {
                if (!userObj || !userObj.id) return;
                try { await setDoc(publicDoc('users', userObj.id), userObj, { merge: true }); } 
                catch (e) { console.error(e); }
            }
        };

        window.handleAuthSubmit = (e) => {
            e.preventDefault();
            const identifier = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (window.AppState.authMode === 'register') {
                const name = document.getElementById('auth-name').value.trim();
                window.DB.registerUser(name, identifier, password);
            } else {
                const user = window.AppState.users.find(u => 
                    (u.email.toLowerCase() === identifier.toLowerCase() || u.id === identifier) && u.password === password
                );
                if (user) {
                    window.AppState.currentUser = user;
                    localStorage.setItem('xena_saved_user_id', user.id);
                    window.showNotification('С возвращением, ' + user.name + '!');
                    window.renderApp();
                } else {
                    window.showNotification('Неверный логин, ID или пароль', 'error');
                }
            }
        };

        window.handleLogout = () => {
            window.AppState.currentUser = null;
            window.AppState.activeChatId = null;
            localStorage.removeItem('xena_saved_user_id');
            window.renderApp();
        };

        window.setAuthMode = (mode) => {
            window.AppState.authMode = mode;
            window.renderApp();
        };

        window.autoSendFriendRequest = async (targetUserId) => {
            let currentUser = { ...window.AppState.currentUser };
            targetUserId = String(targetUserId).trim();

            if (targetUserId === currentUser.id) return window.showNotification('Нельзя добавить себя!', 'error');
            
            const targetUser = window.AppState.users.find(u => u.id === targetUserId);
            if (!targetUser) return window.showNotification('Пользователь ' + targetUserId + ' не найден!', 'error');

            currentUser.friends = currentUser.friends || [];
            if (currentUser.friends.includes(targetUserId)) return window.showNotification('Уже в друзьях!', 'error');

            const updatedTarget = { ...targetUser };
            updatedTarget.friendRequests = updatedTarget.friendRequests || [];
            if (!updatedTarget.friendRequests.includes(currentUser.id)) updatedTarget.friendRequests.push(currentUser.id);

            currentUser.sentRequests = currentUser.sentRequests || [];
            if (!currentUser.sentRequests.includes(targetUser.id)) currentUser.sentRequests.push(targetUser.id);

            await window.DB.updateUser(updatedTarget);
            await window.DB.updateUser(currentUser);
            window.showNotification('Заявка отправлена!');
        };

        window.acceptFriendRequest = async (senderId) => {
            let currentUser = { ...window.AppState.currentUser };
            const sender = window.AppState.users.find(u => u.id === senderId);
            if (!sender) return;

            let updatedSender = { ...sender };
            currentUser.friends = currentUser.friends || [];
            if (!currentUser.friends.includes(sender.id)) currentUser.friends.push(sender.id);

            updatedSender.friends = updatedSender.friends || [];
            if (!updatedSender.friends.includes(currentUser.id)) updatedSender.friends.push(currentUser.id);

            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            updatedSender.sentRequests = (updatedSender.sentRequests || []).filter(id => id !== currentUser.id);

            await window.DB.updateUser(currentUser);
            await window.DB.updateUser(updatedSender);
            window.showNotification('Пользователь добавлен в друзья!');
            window.renderApp();
        };

        window.handleSendMessage = async (e, chatId, isGroup) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            await addDoc(publicPath('messages'), {
                senderId: window.AppState.currentUser.id,
                senderName: window.AppState.currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'text',
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        };

        window.sendStickerMessage = async (chatId, isGroup, stickerUrl) => {
            await addDoc(publicPath('messages'), {
                senderId: window.AppState.currentUser.id,
                senderName: window.AppState.currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'sticker',
                stickerUrl: stickerUrl,
                timestamp: Date.now()
            });
            window.AppState.isStickersOpen = false;
            window.renderApp();
        };

        window.handleCreateGroupSubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('group-name-input').value.trim();
            const newGroupId = 'g_' + Math.random().toString(36).substr(2, 7);
            
            await setDoc(publicDoc('groups', newGroupId), {
                id: newGroupId,
                name,
                adminId: window.AppState.currentUser.id,
                members: [window.AppState.currentUser.id]
            });
            
            window.closeCreateGroupModal();
            window.AppState.activeTab = 'chats';
            window.renderApp();
        };

        window.handleCreateSticker = async (e) => {
            e.preventDefault();
            const name = document.getElementById('sticker-name').value.trim();
            const url = document.getElementById('sticker-url').value.trim();
            const newStickerId = 'st_' + Math.random().toString(36).substr(2, 7);
            
            await setDoc(publicDoc('stickers', newStickerId), { id: newStickerId, name, url });
            window.showNotification('Стикер добавлен!');
        };

        window.switchTab = (tab) => { window.AppState.activeTab = tab; window.renderApp(); };
        window.openChat = (id) => { window.AppState.activeChatId = id; window.AppState.activeTab = 'chats'; window.renderApp(); window.scrollToBottom(); };

        window.renderApp = () => {
            const app = document.getElementById('app');
            const currentUser = window.AppState.currentUser;
            
            if (!currentUser) {
                app.innerHTML = window.renderAuthScreen();
                return;
            }

            if (currentUser.darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            app.innerHTML = `
                ${window.AppState.notificationMessage ? window.renderToast(window.AppState.notificationMessage) : ''}
                <div class="flex h-full w-full overflow-hidden relative">
                    <!-- Sidebar -->
                    <aside class="w-20 md:w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-20">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center text-white shrink-0">
                                ${currentUser.avatar ? `<img src="${currentUser.avatar}" class="w-full h-full object-cover rounded-xl">` : currentUser.name.charAt(0).toUpperCase()}
                            </div>
                            <div class="hidden md:block truncate">
                                <h2 class="font-semibold text-sm truncate">${window.escapeHtml(currentUser.name)}</h2>
                                <p class="text-xs text-slate-500 truncate">ID: ${currentUser.id}</p>
                            </div>
                        </div>
                        <nav class="p-3 space-y-1 flex-1 overflow-y-auto hide-scroll">
                            ${window.renderNavButton('chats', 'Чаты', 'fa-comments')}
                            ${window.renderNavButton('groups', 'Группы', 'fa-users')}
                            ${window.renderNavButton('stickers', 'Стикеры', 'fa-face-smile')}
                            ${window.renderNavButton('search', 'Поиск ID', 'fa-user-plus')}
                            ${window.renderNavButton('requests', 'Заявки', 'fa-bell', currentUser.friendRequests?.length)}
                            ${window.renderNavButton('profile', 'Профиль', 'fa-gear')}
                        </nav>
                        <div class="p-3 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="handleLogout()" class="w-full flex items-center justify-center md:justify-start space-x-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition">
                                <i class="fa-solid fa-right-from-bracket w-6 text-center"></i><span class="hidden md:inline font-medium text-sm">Выйти</span>
                            </button>
                        </div>
                    </aside>
                    <!-- Main Area -->
                    <main class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-950">
                        ${window.renderMainContent()}
                    </main>
                </div>
            `;
        };

        window.renderNavButton = (id, label, icon, badgeCount) => {
            const isActive = window.AppState.activeTab === id;
            return `
                <button onclick="switchTab('${id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition relative ${isActive ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                    <i class="fa-solid ${icon} text-lg w-6 text-center"></i>
                    <span class="hidden md:inline">${label}</span>
                    ${badgeCount ? `<span class="absolute right-3 top-3 md:static bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">${badgeCount}</span>` : ''}
                </button>
            `;
        };

        window.renderMainContent = () => {
            const tab = window.AppState.activeTab;
            if (tab === 'search') return window.renderSearchTab();
            if (tab === 'requests') return window.renderRequestsTab();
            if (tab === 'groups') return window.renderGroupsTab();
            if (tab === 'stickers') return window.renderStickersTab();
            if (tab === 'profile') return window.renderProfileTab();
            return window.renderChatsTab();
        };

        window.renderAuthScreen = () => {
            const mode = window.AppState.authMode;
            return `
                <div class="flex h-full w-full items-center justify-center bg-slate-100 dark:bg-slate-950 p-4">
                    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-brand-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4"><i class="fa-solid fa-bolt"></i></div>
                            <h1 class="text-2xl font-bold">Xena Messenger</h1>
                        </div>
                        <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl mb-6">
                            <button onclick="setAuthMode('login')" class="flex-1 py-2 text-sm font-medium rounded-lg ${mode === 'login' ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-500'}">Вход</button>
                            <button onclick="setAuthMode('register')" class="flex-1 py-2 text-sm font-medium rounded-lg ${mode === 'register' ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-500'}">Регистрация</button>
                        </div>
                        <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                            ${mode === 'register' ? `<input type="text" id="auth-name" required placeholder="Имя" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:border-brand-500">` : ''}
                            <input type="text" id="auth-email" required placeholder="Email или ID" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:border-brand-500">
                            <input type="password" id="auth-password" required placeholder="Пароль" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:border-brand-500">
                            <button type="submit" class="w-full py-3 bg-brand-500 text-white font-semibold rounded-xl">${mode === 'login' ? 'Войти' : 'Создать'}</button>
                        </form>
                        <div class="mt-6 text-center">
                            <button onclick="clearFirebaseConfig()" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 underline">Изменить настройки Firebase</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.renderChatsTab = () => {
            const { activeChatId, groups, users, currentUser } = window.AppState;
            const myGroups = groups.filter(g => g.members && g.members.includes(currentUser.id));
            const friendsIds = currentUser.friends || [];

            return `
                <div class="flex h-full w-full">
                    <div class="${activeChatId ? 'hidden md:flex' : 'flex'} w-full md:w-80 flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800"><h2 class="font-bold text-lg">Диалоги</h2></div>
                        <div class="flex-1 overflow-y-auto hide-scroll divide-y divide-slate-100 dark:divide-slate-800/60">
                            ${myGroups.map(g => `
                                <div onclick="openChat('${g.id}')" class="flex items-center space-x-3 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 ${activeChatId === g.id ? 'bg-slate-100 dark:bg-slate-800' : ''}">
                                    <div class="w-12 h-12 rounded-xl bg-purple-500 flex items-center justify-center text-white shrink-0"><i class="fa-solid fa-users"></i></div>
                                    <div class="flex-1 truncate"><h3 class="font-semibold text-sm truncate">${window.escapeHtml(g.name)}</h3></div>
                                </div>
                            `).join('')}
                            ${friendsIds.map(fId => {
                                const friend = users.find(u => u.id === fId);
                                if (!friend) return '';
                                return `
                                <div onclick="openChat('${friend.id}')" class="flex items-center space-x-3 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 ${activeChatId === friend.id ? 'bg-slate-100 dark:bg-slate-800' : ''}">
                                    <div class="w-12 h-12 rounded-xl bg-brand-500 flex items-center justify-center text-white shrink-0">
                                        ${friend.avatar ? `<img src="${window.escapeHtml(friend.avatar)}" class="w-full h-full object-cover rounded-xl">` : friend.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="flex-1 truncate"><h3 class="font-semibold text-sm truncate">${window.escapeHtml(friend.name)}</h3></div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                    <div class="${!activeChatId ? 'hidden md:flex' : 'flex'} flex-1 flex-col h-full bg-slate-50 dark:bg-slate-950">
                        ${activeChatId ? window.renderActiveChat(currentUser, activeChatId) : `<div class="flex-1 flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-comments text-4xl mb-4"></i><p>Выберите диалог</p></div>`}
                    </div>
                </div>
            `;
        };

        window.renderActiveChat = (currentUser, chatId) => {
            const isGroup = chatId.startsWith('g_');
            let chatName = 'Чат';
            if (isGroup) {
                const g = window.AppState.groups.find(x => x.id === chatId);
                if (g) chatName = g.name;
            } else {
                const f = window.AppState.users.find(x => x.id === chatId);
                if (f) chatName = f.name;
            }

            const messages = window.AppState.messages.filter(m => {
                if (isGroup) return m.chatId === chatId;
                return !m.isGroup && ((m.senderId === currentUser.id && m.chatId === chatId) || (m.senderId === chatId && m.chatId === currentUser.id));
            }).sort((a,b) => a.timestamp - b.timestamp);

            return `
                <div class="flex flex-col h-full bg-white dark:bg-slate-900 relative">
                    <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
                        <button onclick="window.AppState.activeChatId=null; window.renderApp();" class="md:hidden text-slate-500"><i class="fa-solid fa-arrow-left"></i></button>
                        <h3 class="font-bold text-sm">${window.escapeHtml(chatName)}</h3>
                    </div>
                    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50 dark:bg-slate-950/50">
                        ${messages.map(msg => {
                            const isMe = msg.senderId === currentUser.id;
                            return `
                                <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                                    <div class="max-w-[75%] rounded-2xl px-4 py-2 ${isMe ? 'bg-brand-500 text-white rounded-br-none' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-bl-none'}">
                                        ${isGroup && !isMe ? `<div class="text-[10px] font-bold text-brand-300 mb-1">${window.escapeHtml(msg.senderName)}</div>` : ''}
                                        ${msg.type === 'sticker' ? `<img src="${window.escapeHtml(msg.stickerUrl)}" class="w-32 h-32 object-cover rounded-xl my-1">` : `<p class="text-sm break-words">${window.escapeHtml(msg.text)}</p>`}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    ${window.AppState.isStickersOpen ? `
                        <div class="absolute bottom-20 left-4 w-72 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-2xl grid grid-cols-3 gap-2 max-h-60 overflow-y-auto">
                            ${window.AppState.stickers.map(st => `
                                <button onclick="sendStickerMessage('${chatId}', ${isGroup}, '${window.escapeHtml(st.url)}')" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">
                                    <img src="${window.escapeHtml(st.url)}" class="w-12 h-12 object-cover rounded-lg">
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                    <form onsubmit="handleSendMessage(event, '${chatId}', ${isGroup})" class="p-3 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                        <button type="button" onclick="window.AppState.isStickersOpen=!window.AppState.isStickersOpen; window.renderApp();" class="p-3 text-slate-500"><i class="fa-solid fa-face-smile text-xl"></i></button>
                        <input type="text" id="chat-input" placeholder="Сообщение..." autocomplete="off" class="flex-1 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:border-brand-500 text-sm">
                        <button type="submit" class="w-12 h-12 bg-brand-500 text-white rounded-xl"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>
            `;
        };

        window.renderSearchTab = () => {
            return `
                <div class="p-6 h-full"><h2 class="font-bold text-xl mb-6">Добавить по ID</h2>
                    <div class="max-w-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                        <div class="flex gap-2">
                            <input type="text" id="search-id-input" placeholder="ID (например 0000000002)" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:border-brand-500">
                            <button onclick="autoSendFriendRequest(document.getElementById('search-id-input').value)" class="px-6 py-3 bg-brand-500 text-white font-semibold rounded-xl text-sm">Добавить</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.renderRequestsTab = () => {
            const reqs = window.AppState.currentUser.friendRequests || [];
            return `
                <div class="p-6 h-full overflow-y-auto"><h2 class="font-bold text-xl mb-6">Входящие заявки</h2>
                    <div class="space-y-4 max-w-2xl">
                        ${reqs.map(id => {
                            const sender = window.AppState.users.find(u => u.id === id);
                            if(!sender) return '';
                            return `
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex items-center justify-between shadow-sm">
                                <div class="flex gap-4 items-center">
                                    <div class="w-10 h-10 rounded-xl bg-brand-500 text-white flex items-center justify-center font-bold">${sender.name.charAt(0)}</div>
                                    <div><h3 class="font-semibold text-sm">${window.escapeHtml(sender.name)}</h3><p class="text-xs text-slate-500">ID: ${sender.id}</p></div>
                                </div>
                                <button onclick="acceptFriendRequest('${sender.id}')" class="px-4 py-2 bg-brand-500 text-white text-xs rounded-xl">Принять</button>
                            </div>`;
                        }).join('')}
                        ${reqs.length === 0 ? '<p class="text-slate-500 text-sm">Нет новых заявок</p>' : ''}
                    </div>
                </div>
            `;
        };

        window.renderGroupsTab = () => {
            return `
                <div class="p-6 h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-bold text-xl">Группы</h2>
                        <button onclick="document.getElementById('group-modal').classList.remove('hidden')" class="px-4 py-2 bg-brand-500 text-white text-xs rounded-xl">Создать</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${window.AppState.groups.map(g => {
                            const isMember = g.members.includes(window.AppState.currentUser.id);
                            return `
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
                                <h3 class="font-semibold text-sm mb-4">${window.escapeHtml(g.name)}</h3>
                                ${isMember ? `<button onclick="openChat('${g.id}')" class="w-full py-2 bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 text-xs rounded-xl">Открыть</button>`
                                           : `<button onclick="joinGroup('${g.id}')" class="w-full py-2 bg-brand-500 text-white text-xs rounded-xl">Вступить</button>`}
                            </div>`;
                        }).join('')}
                    </div>
                </div>
                
                <div id="group-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl p-6">
                        <h3 class="font-bold text-lg mb-4">Создать группу</h3>
                        <form onsubmit="handleCreateGroupSubmit(event)" class="space-y-4">
                            <input type="text" id="group-name-input" required placeholder="Название группы" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:border-brand-500">
                            <div class="flex justify-end gap-2">
                                <button type="button" onclick="document.getElementById('group-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-xs rounded-xl">Отмена</button>
                                <button type="submit" class="px-4 py-2 bg-brand-500 text-white text-xs rounded-xl">Создать</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        };

        window.joinGroup = async (groupId) => {
            const group = window.AppState.groups.find(g => g.id === groupId);
            if (!group) return;
            const updatedGroup = { ...group };
            updatedGroup.members.push(window.AppState.currentUser.id);
            await setDoc(publicDoc('groups', groupId), updatedGroup);
            window.showNotification('Вы вступили в группу!');
        };

        window.renderStickersTab = () => {
            return `
                <div class="p-6 h-full overflow-y-auto">
                    <h2 class="font-bold text-xl mb-6">Стикеры</h2>
                    <form onsubmit="handleCreateSticker(event)" class="max-w-xl mb-8 space-y-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                        <input type="text" id="sticker-name" required placeholder="Название" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
                        <input type="url" id="sticker-url" required placeholder="URL картинки (https://...)" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
                        <button type="submit" class="w-full py-3 bg-brand-500 text-white font-semibold rounded-xl text-sm">Добавить глобально</button>
                    </form>
                    <div class="grid grid-cols-4 md:grid-cols-6 gap-4">
                        ${window.AppState.stickers.map(st => `
                            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-2 flex flex-col items-center">
                                <img src="${window.escapeHtml(st.url)}" class="w-12 h-12 object-cover rounded-lg mb-1">
                                <span class="text-[9px] truncate w-full text-center">${window.escapeHtml(st.name)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        window.renderProfileTab = () => {
            const u = window.AppState.currentUser;
            return `
                <div class="p-6 h-full">
                    <h2 class="font-bold text-xl mb-6">Профиль</h2>
                    <div class="max-w-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-16 h-16 rounded-2xl bg-brand-500 text-white text-2xl font-bold flex justify-center items-center">
                                ${u.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">${window.escapeHtml(u.name)}</h3>
                                <p class="text-sm text-slate-500 font-mono">ID: <span class="font-bold text-brand-600">${u.id}</span></p>
                            </div>
                        </div>
                        <button onclick="clearFirebaseConfig()" class="w-full py-3 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 font-semibold rounded-xl text-sm transition hover:bg-red-200 dark:hover:bg-red-900/50">Сбросить настройки Firebase (Выход)</button>
                    </div>
                </div>
            `;
        };

        window.renderToast = (notification) => {
            return `
                <div class="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-800">
                    <i class="fa-solid fa-circle-check text-brand-500 text-xl"></i><span class="text-sm font-medium">${window.escapeHtml(notification.text)}</span>
                </div>
            `;
        };

        // Bootstrap App
        initFirebase();
    </script>
</body>
</html>
