<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger (Cloud Synced)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased overflow-hidden transition-colors duration-200">

    <div id="app" class="h-full w-full flex flex-col items-center justify-center">
        <!-- Loading Screen while Firebase initializes -->
        <div class="animate-pulse flex flex-col items-center space-y-4">
            <div class="w-16 h-16 bg-brand-500 rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <p class="text-slate-500 font-medium">Подключение к облаку...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'xena-messenger-v1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            projectId: "demo-project",
            apiKey: "demo-key" // Default mock config for local environments without config
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State connected to Firebase
        window.AppState = {
            users: [],
            messages: [],
            groups: [],
            stickers: [
                // Default built-in stickers
                { id: 'st_1', name: 'Огонь', url: 'https://placehold.co/120x120/22c55e/ffffff?text=🔥' },
                { id: 'st_2', name: 'Сердце', url: 'https://placehold.co/120x120/ef4444/ffffff?text=❤️' },
                { id: 'st_3', name: 'Смех', url: 'https://placehold.co/120x120/eab308/ffffff?text=😂' }
            ],
            currentUser: null,
            activeTab: 'chats',
            activeChatId: null,
            authMode: 'login',
            notificationMessage: null,
            activeCall: null,
            isStickersOpen: false,
            linkQuery: '',
            pendingFriendLinkId: null
        };

        // UI Helpers
        window.showNotification = (msg, type = 'success') => {
            window.AppState.notificationMessage = { text: msg, type };
            window.renderApp();
            setTimeout(() => {
                if (window.AppState.notificationMessage && window.AppState.notificationMessage.text === msg) {
                    window.AppState.notificationMessage = null;
                    window.renderApp();
                }
            }, 3500);
        };

        window.formatTime = (timestamp) => {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        window.escapeHtml = (str) => {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        };

        window.scrollToBottom = () => {
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 50);
        };

        const publicPath = (col) => collection(db, 'artifacts', appId, 'public', 'data', col);
        const publicDoc = (col, docId) => doc(db, 'artifacts', appId, 'public', 'data', col, String(docId));

        async function initAuthAndData() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Check for saved login session in localStorage
                const savedId = localStorage.getItem('xena_saved_user_id');

                // Start real-time listeners (fetching all docs without complex queries)
                onSnapshot(publicPath('users'), (snapshot) => {
                    const users = [];
                    snapshot.forEach(doc => users.push(doc.data()));
                    window.AppState.users = users;

                    if (savedId && !window.AppState.currentUser) {
                        const user = users.find(u => u.id === savedId);
                        if (user) window.AppState.currentUser = user;
                    } else if (window.AppState.currentUser) {
                        // Refresh current user data if updated externally
                        const freshUser = users.find(u => u.id === window.AppState.currentUser.id);
                        if (freshUser) window.AppState.currentUser = freshUser;
                    }
                    
                    window.renderApp();
                }, (error) => console.error("Users listener error:", error));

                onSnapshot(publicPath('messages'), (snapshot) => {
                    const messages = [];
                    snapshot.forEach(doc => messages.push({ ...doc.data(), docId: doc.id }));
                    window.AppState.messages = messages;
                    window.renderApp();
                    window.scrollToBottom();
                }, (error) => console.error("Messages listener error:", error));

                onSnapshot(publicPath('groups'), (snapshot) => {
                    const groups = [];
                    snapshot.forEach(doc => groups.push(doc.data()));
                    window.AppState.groups = groups;
                    window.renderApp();
                }, (error) => console.error("Groups listener error:", error));

                onSnapshot(publicPath('stickers'), (snapshot) => {
                    const cloudStickers = [];
                    snapshot.forEach(doc => cloudStickers.push(doc.data()));
                    
                    // Merge default and cloud stickers
                    const defaultIds = ['st_1', 'st_2', 'st_3'];
                    const allStickers = [...window.AppState.stickers.filter(s => defaultIds.includes(s.id)), ...cloudStickers];
                    window.AppState.stickers = allStickers;
                    window.renderApp();
                }, (error) => console.error("Stickers listener error:", error));

                // Process pending links from URL on load
                const params = new URLSearchParams(window.location.search);
                const targetId = params.get('add');
                if (targetId) {
                    window.AppState.pendingFriendLinkId = targetId;
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

            } catch (err) {
                console.error("Auth/DB Init Error:", err);
                document.getElementById('app').innerHTML = `<div class="p-8 text-red-500 text-center">Ошибка подключения к облаку.</div>`;
            }
        }

        // Initialize App
        initAuthAndData();

        window.DB = {
            getNextUserId() {
                const users = window.AppState.users;
                if (users.length === 0) return '0000000001';
                let maxId = 0;
                users.forEach(u => {
                    const num = parseInt(u.id, 10);
                    if (!isNaN(num) && num > maxId) maxId = num;
                });
                const nextNum = maxId + 1;
                return String(nextNum).padStart(10, '0');
            },
            async registerUser(name, email, password) {
                const newId = this.getNextUserId();
                const newUser = {
                    id: newId,
                    name,
                    email,
                    password, // Note: In a real prod app, never store plain text passwords. This is for the simulation.
                    bio: 'Привет! Мой ID в Xena: ' + newId,
                    avatar: '',
                    darkMode: false,
                    friends: [],
                    friendRequests: [],
                    sentRequests: []
                };
                try {
                    await setDoc(publicDoc('users', newId), newUser);
                    window.AppState.currentUser = newUser;
                    localStorage.setItem('xena_saved_user_id', newId);
                    window.showNotification('Успешно! Ваш ID: ' + newId);
                    window.renderApp();
                } catch (e) {
                    console.error("Register err:", e);
                    window.showNotification('Ошибка регистрации', 'error');
                }
            },
            async updateUser(userObj) {
                if (!userObj || !userObj.id) return;
                try {
                    await setDoc(publicDoc('users', userObj.id), userObj, { merge: true });
                } catch (e) {
                    console.error("Update user err:", e);
                }
            }
        };

        // Actions
        window.handleAuthSubmit = (e) => {
            e.preventDefault();
            const identifier = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (window.AppState.authMode === 'register') {
                const name = document.getElementById('auth-name').value.trim();
                window.DB.registerUser(name, identifier, password);
            } else {
                const user = window.AppState.users.find(u => 
                    (u.email.toLowerCase() === identifier.toLowerCase() || u.id === identifier) && u.password === password
                );
                if (user) {
                    window.AppState.currentUser = user;
                    localStorage.setItem('xena_saved_user_id', user.id);
                    window.showNotification('С возвращением, ' + user.name + '!');
                    window.renderApp();
                } else {
                    window.showNotification('Неверный логин, ID или пароль', 'error');
                }
            }
        };

        window.handleLogout = () => {
            window.AppState.currentUser = null;
            window.AppState.activeChatId = null;
            window.AppState.activeTab = 'chats';
            localStorage.removeItem('xena_saved_user_id');
            window.showNotification('Вы вышли из системы');
            window.renderApp();
        };

        window.setAuthMode = (mode) => {
            window.AppState.authMode = mode;
            window.renderApp();
        };

        window.switchTab = (tab) => {
            window.AppState.activeTab = tab;
            if (tab !== 'chats') window.AppState.activeChatId = null;
            window.AppState.isStickersOpen = false;
            window.renderApp();
        };

        window.autoSendFriendRequest = async (targetUserId) => {
            let currentUser = { ...window.AppState.currentUser };
            targetUserId = String(targetUserId).trim();

            if (targetUserId === currentUser.id) {
                window.showNotification('Нельзя отправить заявку самому себе!', 'error');
                return;
            }

            const targetUser = window.AppState.users.find(u => u.id === targetUserId);
            if (!targetUser) {
                window.showNotification('Пользователь с ID ' + targetUserId + ' не найден!', 'error');
                return;
            }

            currentUser.friends = currentUser.friends || [];
            if (currentUser.friends.includes(targetUserId)) {
                window.showNotification('Этот пользователь уже у вас в друзьях!', 'error');
                return;
            }

            // Update Target User's requests
            const updatedTarget = { ...targetUser };
            updatedTarget.friendRequests = updatedTarget.friendRequests || [];
            if (!updatedTarget.friendRequests.includes(currentUser.id)) {
                updatedTarget.friendRequests.push(currentUser.id);
            }

            // Update Current User's sent requests
            currentUser.sentRequests = currentUser.sentRequests || [];
            if (!currentUser.sentRequests.includes(targetUser.id)) {
                currentUser.sentRequests.push(targetUser.id);
            }

            // Save to Firebase
            await window.DB.updateUser(updatedTarget);
            await window.DB.updateUser(currentUser);

            window.showNotification('Заявка пользователю ' + targetUser.name + ' отправлена!');
            window.AppState.activeTab = 'chats';
            window.renderApp();
        };

        window.submitFriendByIdFromPencil = () => {
            const input = document.getElementById('pencil-friend-id');
            const targetId = (input.value || '').trim();
            if (!targetId) {
                window.showNotification('Введите ID пользователя', 'error');
                return;
            }
            window.closePencilMenu();
            window.autoSendFriendRequest(targetId);
        };

        window.handleLinkInput = (e) => {
            window.AppState.linkQuery = e.target.value;
        };

        window.submitFriendByLink = () => {
            const query = (window.AppState.linkQuery || '').trim();
            if (!query) {
                window.showNotification('Введите ID или ссылку', 'error');
                return;
            }

            let targetId = query;
            if (query.includes('add=')) {
                try {
                    const url = new URL(query.includes('http') ? query : 'http://localhost/?' + query.split('?')[1]);
                    targetId = url.searchParams.get('add');
                } catch(e) {
                    const parts = query.split('add=');
                    if (parts[1]) targetId = parts[1].split('&')[0];
                }
            }

            window.autoSendFriendRequest(targetId);
            window.AppState.linkQuery = '';
            window.renderApp();
        };

        window.acceptFriendRequest = async (senderId) => {
            let currentUser = { ...window.AppState.currentUser };
            const sender = window.AppState.users.find(u => u.id === senderId);

            if (!sender) return;
            let updatedSender = { ...sender };

            currentUser.friends = currentUser.friends || [];
            if (!currentUser.friends.includes(sender.id)) currentUser.friends.push(sender.id);

            updatedSender.friends = updatedSender.friends || [];
            if (!updatedSender.friends.includes(currentUser.id)) updatedSender.friends.push(currentUser.id);

            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            updatedSender.sentRequests = (updatedSender.sentRequests || []).filter(id => id !== currentUser.id);

            await window.DB.updateUser(currentUser);
            await window.DB.updateUser(updatedSender);

            window.showNotification('Вы добавили ' + sender.name + ' в друзья!');
            window.AppState.activeChatId = sender.id;
            window.AppState.activeTab = 'chats';
            window.renderApp();
        };

        window.rejectFriendRequest = async (senderId) => {
            let currentUser = { ...window.AppState.currentUser };
            const sender = window.AppState.users.find(u => u.id === senderId);

            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            await window.DB.updateUser(currentUser);

            if (sender) {
                let updatedSender = { ...sender };
                updatedSender.sentRequests = (updatedSender.sentRequests || []).filter(id => id !== currentUser.id);
                await window.DB.updateUser(updatedSender);
            }

            window.showNotification('Заявка отклонена');
            window.renderApp();
        };

        window.handleSendMessage = async (e, chatId, isGroup) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const currentUser = window.AppState.currentUser;
            const newMessage = {
                senderId: currentUser.id,
                senderName: currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'text',
                text: text,
                timestamp: Date.now()
            };

            await addDoc(publicPath('messages'), newMessage);
            
            input.value = '';
            window.scrollToBottom();
        };

        window.sendStickerMessage = async (chatId, isGroup, stickerUrl) => {
            const currentUser = window.AppState.currentUser;
            const newMessage = {
                senderId: currentUser.id,
                senderName: currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'sticker',
                stickerUrl: stickerUrl,
                timestamp: Date.now()
            };

            await addDoc(publicPath('messages'), newMessage);
            
            window.AppState.isStickersOpen = false;
            window.renderApp();
            window.scrollToBottom();
        };

        window.handleCreateGroupSubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('group-name-input').value.trim();
            const description = document.getElementById('group-desc-input').value.trim();
            const currentUser = window.AppState.currentUser;

            const newGroupId = 'g_' + Math.random().toString(36).substr(2, 7);
            const newGroup = {
                id: newGroupId,
                name,
                description,
                adminId: currentUser.id,
                members: [currentUser.id]
            };

            await setDoc(publicDoc('groups', newGroupId), newGroup);
            
            window.closeCreateGroupModal();
            window.showNotification('Группа создана!');
            window.AppState.activeChatId = newGroupId;
            window.AppState.activeTab = 'chats';
            window.renderApp();
        };

        window.joinGroup = async (groupId) => {
            const group = window.AppState.groups.find(g => g.id === groupId);
            if (!group) return;
            const currentUser = window.AppState.currentUser;

            if (!group.members.includes(currentUser.id)) {
                const updatedGroup = { ...group };
                updatedGroup.members.push(currentUser.id);
                await setDoc(publicDoc('groups', groupId), updatedGroup);
                window.showNotification('Вы вошли в группу!');
            }
            window.AppState.activeChatId = groupId;
            window.AppState.activeTab = 'chats';
            window.renderApp();
        };

        window.handleCreateSticker = async (e) => {
            e.preventDefault();
            const name = document.getElementById('sticker-name').value.trim();
            const url = document.getElementById('sticker-url').value.trim();

            const newStickerId = 'st_' + Math.random().toString(36).substr(2, 7);
            const newSticker = {
                id: newStickerId,
                name,
                url
            };

            await setDoc(publicDoc('stickers', newStickerId), newSticker);
            window.showNotification('Стикер успешно создан и доступен всем!');
            window.renderApp();
        };

        window.handleProfileUpdate = async (e) => {
            e.preventDefault();
            let currentUser = { ...window.AppState.currentUser };
            currentUser.name = document.getElementById('profile-name').value.trim();
            currentUser.avatar = document.getElementById('profile-avatar').value.trim();
            currentUser.bio = document.getElementById('profile-bio').value.trim();
            currentUser.darkMode = document.getElementById('profile-darkmode').checked;

            await window.DB.updateUser(currentUser);
            window.showNotification('Профиль успешно обновлен!');
        };

        window.renderApp = () => {
            const app = document.getElementById('app');
            const currentUser = window.AppState.currentUser;
            const { notificationMessage, activeCall, activeTab, pendingFriendLinkId } = window.AppState;

            // Process auto-link request once logged in
            if (currentUser && pendingFriendLinkId) {
                const targetId = pendingFriendLinkId;
                window.AppState.pendingFriendLinkId = null; 
                if (targetId !== currentUser.id) {
                    window.autoSendFriendRequest(targetId);
                }
            }

            if (!currentUser) {
                app.innerHTML = window.renderAuthScreen();
                return;
            }

            if (currentUser.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            app.innerHTML = `
                ${notificationMessage ? window.renderToast(notificationMessage) : ''}
                ${activeCall ? window.renderCallModal() : ''}
                <div class="flex h-full w-full overflow-hidden relative">
                    <!-- Sidebar Navigation -->
                    <aside class="w-20 md:w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between shrink-0 z-20 transition-colors">
                        <div class="flex flex-col h-full">
                            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white font-bold text-lg shadow-md shrink-0 overflow-hidden">
                                        ${currentUser.avatar ? `<img src="${window.escapeHtml(currentUser.avatar)}" class="w-full h-full object-cover">` : currentUser.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="hidden md:block truncate">
                                        <h2 class="font-semibold text-sm truncate">${window.escapeHtml(currentUser.name)}</h2>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate">ID: ${currentUser.id}</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button onclick="openPencilMenu()" title="Создать / Добавить друга" class="text-slate-500 hover:text-brand-500 transition p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                                        <i class="fa-solid fa-pen-to-square text-lg"></i>
                                    </button>
                                    <button onclick="handleLogout()" title="Выйти" class="hidden md:flex text-slate-400 hover:text-red-500 transition p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                                        <i class="fa-solid fa-right-from-bracket"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Tabs Navigation -->
                            <nav class="p-3 space-y-1 flex-1 overflow-y-auto hide-scroll">
                                <button onclick="switchTab('chats')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'chats' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-comments text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Чаты</span>
                                </button>
                                <button onclick="switchTab('groups')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'groups' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-users text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Группы / Каналы</span>
                                </button>
                                <button onclick="switchTab('stickers')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'stickers' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-face-smile text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Стикеры</span>
                                </button>
                                <button onclick="switchTab('search')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'search' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-link text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Поиск и ссылка</span>
                                </button>
                                <button onclick="switchTab('requests')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition relative ${activeTab === 'requests' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-bell text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Заявки в друзья</span>
                                    ${(currentUser.friendRequests && currentUser.friendRequests.length > 0) ? `
                                        <span class="absolute right-3 top-3 md:static bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">${currentUser.friendRequests.length}</span>
                                    ` : ''}
                                </button>
                                <button onclick="switchTab('profile')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'profile' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-user-gear text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Настройки</span>
                                </button>
                            </nav>
                        </div>

                            </div>
                        </div>
                        <input type="text" id="profile-name" value="${window.escapeHtml(currentUser.name)}" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:border-brand-500">
                        <input type="text" id="profile-avatar" value="${window.escapeHtml(currentUser.avatar || '')}" placeholder="URL аватара" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:border-brand-500">
                        <div class="flex items-center justify-between py-2 border-t border-slate-200 dark:border-slate-800">
                            <div><h4 class="font-semibold text-sm">Темная тема</h4></div>
                            <input type="checkbox" id="profile-darkmode" ${currentUser.darkMode ? 'checked' : ''} class="w-5 h-5 accent-brand-500 cursor-pointer">
                        </div>
                        <button type="submit" class="w-full py-3 bg-brand-500 text-white font-semibold rounded-xl text-sm">Сохранить</button>
                    </form>
                </div>
            `;
        };

        window.renderToast = (notification) => {
            return `
                <div class="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-800">
                    <i class="fa-solid fa-circle-check text-brand-500 text-xl"></i>
                    <span class="text-sm font-medium">${window.escapeHtml(notification.text)}</span>
                </div>
            `;
        };

        window.renderCallModal = () => ''; // Removed simulation modal to simplify code
    </script>
</body>
</html>
