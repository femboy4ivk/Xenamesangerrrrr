<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger</title>
    <!-- Установка Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Настройка Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Стилизация скроллбара */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .dark .glass-panel { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased overflow-hidden transition-colors duration-200">

    <!-- Корневой контейнер приложения -->
    <div id="app" class="h-full w-full flex flex-col items-center justify-center">
        <!-- Экран загрузки (отображается до инициализации Firebase) -->
        <div class="animate-pulse flex flex-col items-center space-y-4">
            <div class="w-16 h-16 bg-brand-500 rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <p class="text-slate-500 font-medium">Подключение к серверам Xena...</p>
        </div>
    </div>

    <!-- Модальные окна и уведомления (вне основного потока рендера React-style) -->
    <div id="modal-root" class="relative z-50"></div>
    <div id="toast-root" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'xena-messenger-auto';
        
        // Глобальное состояние приложения
        window.AppState = {
            db: null,
            auth: null,
            users: [],
            messages: [],
            groups: [],
            stickers: [
                { id: 'st_1', name: 'Огонь', url: 'https://placehold.co/120x120/22c55e/ffffff?text=🔥' },
                { id: 'st_2', name: 'Сердце', url: 'https://placehold.co/120x120/ef4444/ffffff?text=❤️' }
            ],
            currentUser: null,
            activeTab: 'chats',
            activeChatId: null,
            authMode: 'login',
            isStickersOpen: false,
            isPencilMenuOpen: false,
            callState: null // { active: bool, type: 'video' | 'audio', name: string }
        };

        window.showNotification = (msg, type = 'success') => {
            const toastRoot = document.getElementById('toast-root');
            const toast = document.createElement('div');
            const icon = type === 'error' ? 'fa-triangle-exclamation text-red-500' : 'fa-circle-check text-brand-500';
            toast.className = `bg-white dark:bg-slate-900 text-slate-800 dark:text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-100 dark:border-slate-800 transform transition-all duration-300 translate-x-full opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-xl"></i><span class="text-sm font-medium">${window.escapeHtml(msg)}</span>`;
            toastRoot.appendChild(toast);
            
            // Анимация появления
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.escapeHtml = (str) => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        window.scrollToBottom = () => setTimeout(() => { const c = document.getElementById('messages-container'); if (c) c.scrollTop = c.scrollHeight; }, 50);

        async function initFirebase() {
            try {
                if (typeof __firebase_config === 'undefined') {
                    throw new Error("Окружение не предоставило __firebase_config. Запуск невозможен.");
                }
                
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                window.AppState.db = db;
                window.AppState.auth = auth;

                // Авторизация Canvas
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Запуск слушателей данных
                startDatabaseListeners(db);

            } catch (error) {
                console.error("Firebase Init Error:", error);
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-red-500 space-y-4">
                        <i class="fa-solid fa-triangle-exclamation text-4xl"></i>
                        <p class="font-bold">Критическая ошибка запуска.</p>
                        <p class="text-sm text-slate-500">${error.message}</p>
                    </div>`;
            }
        }

        const publicPath = (col) => collection(window.AppState.db, 'artifacts', appId, 'public', 'data', col);
        const publicDoc = (col, docId) => doc(window.AppState.db, 'artifacts', appId, 'public', 'data', col, String(docId));

        function startDatabaseListeners(db) {
            const savedId = localStorage.getItem('xena_auto_user_id');

            // Слушатель пользователей
            onSnapshot(publicPath('users'), (snapshot) => {
                const users = [];
                snapshot.forEach(doc => users.push(doc.data()));
                window.AppState.users = users;

                // Поддержка сессии через localStorage (т.к. Canvas дает один токен, а нам нужно тестить мульти-юзерность)
                if (savedId && !window.AppState.currentUser) {
                    const user = users.find(u => u.id === savedId);
                    if (user) window.AppState.currentUser = user;
                } else if (window.AppState.currentUser) {
                    const freshUser = users.find(u => u.id === window.AppState.currentUser.id);
                    if (freshUser) window.AppState.currentUser = freshUser;
                }
                
                checkUrlForFriendRequest(); // Проверяем URL при получении пользователей
                window.renderApp();
            }, (err) => console.error(err));

            // Слушатель сообщений
            onSnapshot(publicPath('messages'), (snapshot) => {
                const messages = [];
                snapshot.forEach(doc => messages.push({ ...doc.data(), docId: doc.id }));
                window.AppState.messages = messages;
                window.renderApp();
                window.scrollToBottom();
            }, (err) => console.error(err));

            // Слушатель групп и каналов
            onSnapshot(publicPath('groups'), (snapshot) => {
                const groups = [];
                snapshot.forEach(doc => groups.push(doc.data()));
                window.AppState.groups = groups;
                window.renderApp();
            }, (err) => console.error(err));

            // Слушатель глобальных стикеров
            onSnapshot(publicPath('stickers'), (snapshot) => {
                const cloudStickers = [];
                snapshot.forEach(doc => cloudStickers.push(doc.data()));
                const defaultIds = ['st_1', 'st_2'];
                window.AppState.stickers = [
                    ...window.AppState.stickers.filter(s => defaultIds.includes(s.id)), 
                    ...cloudStickers
                ];
                window.renderApp();
            }, (err) => console.error(err));
        }

        let urlChecked = false;
        function checkUrlForFriendRequest() {
            if (urlChecked || !window.AppState.currentUser || window.AppState.users.length === 0) return;
            urlChecked = true;
            
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('add');
            
            if (targetId) {
                // Очищаем URL, чтобы не спамить при перезагрузке
                window.history.replaceState({}, document.title, window.location.pathname);
                
                if (targetId === window.AppState.currentUser.id) {
                    return window.showNotification("Это ваша собственная ссылка", "error");
                }
                // Автоматически отправляем заявку
                setTimeout(() => window.autoSendFriendRequest(targetId), 1000);
            }
        }

        window.DB = {
            getNextUserId() {
                const users = window.AppState.users;
                if (users.length === 0) return '0000000001';
                let maxId = 0;
                users.forEach(u => {
                    const num = parseInt(u.id, 10);
                    if (!isNaN(num) && num > maxId) maxId = num;
                });
                return String(maxId + 1).padStart(10, '0');
            },
            async registerUser(name, email, password) {
                const newId = this.getNextUserId();
                const newUser = {
                    id: newId,
                    name,
                    email,
                    password, // Локальная имитация для теста нескольких акков
                    bio: 'Всем привет! Я в Xena.',
                    avatar: '',
                    darkMode: false,
                    friends: [],
                    friendRequests: [],
                    sentRequests: []
                };
                try {
                    await setDoc(publicDoc('users', newId), newUser);
                    window.AppState.currentUser = newUser;
                    localStorage.setItem('xena_auto_user_id', newId);
                    window.showNotification('Успешно! Ваш ID: ' + newId);
                    checkUrlForFriendRequest();
                    window.renderApp();
                } catch (e) {
                    window.showNotification('Ошибка регистрации', 'error');
                }
            },
            async updateUser(userObj) {
                if (!userObj || !userObj.id) return;
                try { await setDoc(publicDoc('users', userObj.id), userObj, { merge: true }); } 
                catch (e) { console.error(e); }
            }
        };

        window.handleAuthSubmit = (e) => {
            e.preventDefault();
            const identifier = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (window.AppState.authMode === 'register') {
                const name = document.getElementById('auth-name').value.trim();
                window.DB.registerUser(name, identifier, password);
            } else {
                const user = window.AppState.users.find(u => 
                    (u.email.toLowerCase() === identifier.toLowerCase() || u.id === identifier) && u.password === password
                );
                if (user) {
                    window.AppState.currentUser = user;
                    localStorage.setItem('xena_auto_user_id', user.id);
                    window.showNotification('С возвращением, ' + user.name + '!');
                    checkUrlForFriendRequest();
                    window.renderApp();
                } else {
                    window.showNotification('Неверный логин, ID или пароль', 'error');
                }
            }
        };

        window.handleLogout = () => {
            window.AppState.currentUser = null;
            window.AppState.activeChatId = null;
            localStorage.removeItem('xena_auto_user_id');
            window.renderApp();
        };

        window.setAuthMode = (mode) => {
            window.AppState.authMode = mode;
            window.renderApp();
        };

        window.autoSendFriendRequest = async (targetUserId) => {
            let currentUser = { ...window.AppState.currentUser };
            targetUserId = String(targetUserId).trim();

            if (targetUserId === currentUser.id) return window.showNotification('Нельзя добавить себя!', 'error');
            
            const targetUser = window.AppState.users.find(u => u.id === targetUserId);
            if (!targetUser) return window.showNotification('Пользователь ' + targetUserId + ' не найден!', 'error');

            currentUser.friends = currentUser.friends || [];
            if (currentUser.friends.includes(targetUserId)) return window.showNotification('Пользователь уже в друзьях!', 'error');

            const updatedTarget = { ...targetUser };
            updatedTarget.friendRequests = updatedTarget.friendRequests || [];
            
            if (updatedTarget.friendRequests.includes(currentUser.id)) {
                return window.showNotification('Заявка уже была отправлена!', 'error');
            }
            
            updatedTarget.friendRequests.push(currentUser.id);

            currentUser.sentRequests = currentUser.sentRequests || [];
            if (!currentUser.sentRequests.includes(targetUser.id)) currentUser.sentRequests.push(targetUser.id);

            await window.DB.updateUser(updatedTarget);
            await window.DB.updateUser(currentUser);
            window.showNotification(`Заявка отправлена пользователю ${targetUser.name}!`);
            window.closeModal();
        };

        window.acceptFriendRequest = async (senderId) => {
            let currentUser = { ...window.AppState.currentUser };
            const sender = window.AppState.users.find(u => u.id === senderId);
            if (!sender) return;

            let updatedSender = { ...sender };
            currentUser.friends = currentUser.friends || [];
            if (!currentUser.friends.includes(sender.id)) currentUser.friends.push(sender.id);

            updatedSender.friends = updatedSender.friends || [];
            if (!updatedSender.friends.includes(currentUser.id)) updatedSender.friends.push(currentUser.id);

            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            updatedSender.sentRequests = (updatedSender.sentRequests || []).filter(id => id !== currentUser.id);

            await window.DB.updateUser(currentUser);
            await window.DB.updateUser(updatedSender);
            window.showNotification('Пользователь добавлен в друзья!');
        };

        window.handleSendMessage = async (e, chatId, isGroup) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            await addDoc(publicPath('messages'), {
                senderId: window.AppState.currentUser.id,
                senderName: window.AppState.currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'text',
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        };

        window.sendStickerMessage = async (chatId, isGroup, stickerUrl) => {
            await addDoc(publicPath('messages'), {
                senderId: window.AppState.currentUser.id,
                senderName: window.AppState.currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'sticker',
                stickerUrl: stickerUrl,
                timestamp: Date.now()
            });
            window.AppState.isStickersOpen = false;
            window.renderApp();
        };

        window.handleCreateGroupSubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('group-name-input').value.trim();
            const isChannel = document.getElementById('group-type-channel').checked;
            const newGroupId = 'g_' + Math.random().toString(36).substr(2, 7);
            
            await setDoc(publicDoc('groups', newGroupId), {
                id: newGroupId,
                name,
                isChannel,
                adminId: window.AppState.currentUser.id,
                members: [window.AppState.currentUser.id]
            });
            
            window.closeModal();
            window.AppState.activeTab = 'chats';
            window.showNotification(isChannel ? 'Канал создан' : 'Группа создана');
            window.renderApp();
        };

        window.joinGroup = async (groupId) => {
            const group = window.AppState.groups.find(g => g.id === groupId);
            if (!group) return;
            const updatedGroup = { ...group };
            updatedGroup.members.push(window.AppState.currentUser.id);
            await setDoc(publicDoc('groups', groupId), updatedGroup);
            window.showNotification('Вы присоединились!');
        };

        window.handleCreateSticker = async (e) => {
            e.preventDefault();
            const name = document.getElementById('sticker-name').value.trim();
            const url = document.getElementById('sticker-url').value.trim();
            const newStickerId = 'st_' + Math.random().toString(36).substr(2, 7);
            
            await setDoc(publicDoc('stickers', newStickerId), { id: newStickerId, name, url });
            window.showNotification('Стикер добавлен для всех пользователей!');
            window.closeModal();
        };

        window.switchTab = (tab) => { 
            window.AppState.activeTab = tab; 
            window.AppState.isPencilMenuOpen = false;
            window.renderApp(); 
        };
        
        window.openChat = (id) => { 
            window.AppState.activeChatId = id; 
            window.AppState.activeTab = 'chats'; 
            window.renderApp(); 
            window.scrollToBottom(); 
        };

        window.toggleTheme = async () => {
            const user = window.AppState.currentUser;
            user.darkMode = !user.darkMode;
            await window.DB.updateUser(user);
        };

        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).then(() => window.showNotification('Скопировано в буфер обмена'));
        };

        window.openModal = (htmlContent) => {
            window.AppState.isPencilMenuOpen = false;
            document.getElementById('modal-root').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-slate-200 dark:border-slate-800">
                        ${htmlContent}
                    </div>
                </div>
            `;
        };

        window.closeModal = () => {
            document.getElementById('modal-root').innerHTML = '';
        };

        window.startCall = (type, name) => {
            window.AppState.callState = { active: true, type, name };
            window.renderApp();
        };

        window.endCall = () => {
            window.AppState.callState = null;
            window.renderApp();
        };

        window.renderApp = () => {
            const app = document.getElementById('app');
            const currentUser = window.AppState.currentUser;
            
            if (!currentUser) {
                app.innerHTML = window.renderAuthScreen();
                return;
            }

            // Управление темой
            if (currentUser.darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            app.innerHTML = `
                <div class="flex h-full w-full overflow-hidden relative">
                    <!-- Сайдбар -->
                    <aside class="w-20 md:w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-20 transition-all">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3 relative">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <div class="w-10 h-10 rounded-2xl bg-brand-500 flex items-center justify-center text-white shrink-0 font-bold shadow-md shadow-brand-500/20">
                                    ${currentUser.name.charAt(0).toUpperCase()}
                                </div>
                                <div class="hidden md:block truncate">
                                    <h2 class="font-semibold text-sm truncate">${window.escapeHtml(currentUser.name)}</h2>
                                    <p class="text-[11px] text-slate-500 font-mono truncate">ID: ${currentUser.id}</p>
                                </div>
                            </div>
                            
                            <!-- Кнопка КАРАНДАШ (Меню действий) -->
                            <div class="relative">
                                <button onclick="window.AppState.isPencilMenuOpen = !window.AppState.isPencilMenuOpen; window.renderApp();" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-brand-500 hover:text-white transition">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                ${window.AppState.isPencilMenuOpen ? `
                                    <div class="absolute right-0 top-10 w-48 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                                        <button onclick="window.renderAddFriendModal()" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-2"><i class="fa-solid fa-user-plus text-brand-500 w-4"></i> Добавить друга</button>
                                        <button onclick="window.renderCreateGroupModal()" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-2"><i class="fa-solid fa-users text-purple-500 w-4"></i> Создать группу/канал</button>
                                        <button onclick="window.renderCreateStickerModal()" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-2"><i class="fa-solid fa-face-smile text-yellow-500 w-4"></i> Создать стикер</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        
                        <nav class="p-3 space-y-1 flex-1 overflow-y-auto hide-scroll">
                            ${window.renderNavButton('chats', 'Чаты', 'fa-comments')}
                            ${window.renderNavButton('groups', 'Группы и Каналы', 'fa-network-wired')}
                            ${window.renderNavButton('requests', 'Заявки в друзья', 'fa-bell', currentUser.friendRequests?.length)}
                            ${window.renderNavButton('profile', 'Профиль и Настройки', 'fa-gear')}
                        </nav>
                        
                        <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center">
                            <button onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                <i class="fa-solid ${currentUser.darkMode ? 'fa-sun' : 'fa-moon'}"></i>
                            </button>
                            <button onclick="handleLogout()" class="w-10 h-10 flex items-center justify-center rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </aside>

                    <!-- Основная область -->
                    <main class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-950 relative">
                        ${window.renderMainContent()}
                        ${window.AppState.callState ? window.renderCallScreen() : ''}
                    </main>
                </div>
            `;
        };

        window.renderNavButton = (id, label, icon, badgeCount) => {
            const isActive = window.AppState.activeTab === id;
            return `
                <button onclick="switchTab('${id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-medium text-sm transition relative ${isActive ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                    <i class="fa-solid ${icon} text-lg w-6 text-center"></i>
                    <span class="hidden md:inline">${label}</span>
                    ${badgeCount ? `<span class="absolute right-3 top-3 md:static bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-sm shadow-red-500/50">${badgeCount}</span>` : ''}
                </button>
            `;
        };

        window.renderMainContent = () => {
            const tab = window.AppState.activeTab;
            if (tab === 'requests') return window.renderRequestsTab();
            if (tab === 'groups') return window.renderGroupsTab();
            if (tab === 'profile') return window.renderProfileTab();
            return window.renderChatsTab();
        };

        window.renderAuthScreen = () => {
            const mode = window.AppState.authMode;
            return `
                <div class="flex h-full w-full items-center justify-center bg-slate-50 dark:bg-slate-950 p-4">
                    <div class="w-full max-w-md glass-panel rounded-[2rem] shadow-2xl p-8">
