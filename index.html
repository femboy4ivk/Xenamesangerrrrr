<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex overflow-hidden">

    <div id="app" class="flex h-full w-full relative">
        <!-- Main application rendered via JS -->
    </div>

    <!-- Custom Notification/Modal container -->
    <div id="modal-root"></div>

    <script>
        const STORAGE_KEY = 'xena_messenger_db_v3';
        const CHANNEL_NAME = 'xena_messenger_sync_v3';
        const broadcastChannel = new BroadcastChannel(CHANNEL_NAME);

        // Helper: generate 10-digit zero-padded ID
        function generateXenaId() {
            let db = loadDB();
            let nextId = db.counter || 1;
            db.counter = nextId + 1;
            saveDB(db);
            return String(nextId).padStart(10, '0');
        }

        // Default database structure
        function getInitialDB() {
            const defaultId = "0000000001";
            return {
                counter: 2,
                users: {
                    [defaultId]: {
                        id: defaultId,
                        name: "Xena User",
                        username: "xena_user",
                        avatar: "https://placehold.co/150/6366f1/ffffff?text=X",
                        status: "Online",
                        bio: "Welcome to Xena Messenger!"
                    }
                },
                chats: {}, // chatId -> { id, type: 'direct'|'group'|'channel', name, avatar, members: [userIds], adminId }
                messages: {}, // chatId -> [ { id, senderId, text, timestamp, type, mediaUrl, stickerUrl } ]
                stickers: [
                    { id: 's1', url: 'https://placehold.co/120/f43f5e/ffffff?text=❤️', name: 'Heart' },
                    { id: 's2', url: 'https://placehold.co/120/10b981/ffffff?text=🔥', name: 'Fire' },
                    { id: 's3', url: 'https://placehold.co/120/f59e0b/ffffff?text=🎉', name: 'Party' },
                    { id: 's4', url: 'https://placehold.co/120/3b82f6/ffffff?text=👍', name: 'Thumbs Up' }
                ],
                friendRequests: {} // userId -> [ requesterId ]
            };
        }

        function loadDB() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (!data) {
                    const initial = getInitialDB();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
                    return initial;
                }
                return JSON.parse(data);
            } catch (e) {
                return getInitialDB();
            }
        }

        function saveDB(db, triggerSync = true) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            if (triggerSync) {
                broadcastChannel.postMessage({ type: 'DB_UPDATE', timestamp: Date.now() });
            }
        }

        // Active session profile state
        let currentUser = null;
        let activeChatId = null;
        let activeTab = 'chats'; // 'chats' | 'contacts' | 'settings' | 'stickers'
        let callActive = false;
        let callPeer = null;
        let callType = 'audio'; // 'audio' | 'video'
        let callTimer = 0;
        let callInterval = null;

        // Listen to cross-tab updates
        broadcastChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'DB_UPDATE') {
                refreshAppState();
            }
        };

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                refreshAppState();
            }
        });

        function initApp() {
            let db = loadDB();
            // Check if current user is set in session or default to first user
            let sessionUserId = sessionStorage.getItem('xena_current_user_id');
            if (!sessionUserId || !db.users[sessionUserId]) {
                // Pick the first user or create one
                const userIds = Object.keys(db.users);
                sessionUserId = userIds[0];
                sessionStorage.setItem('xena_current_user_id', sessionUserId);
            }
            currentUser = db.users[sessionUserId];
            renderApp();
        }

        function refreshAppState() {
            let db = loadDB();
            if (currentUser && db.users[currentUser.id]) {
                currentUser = db.users[currentUser.id];
            }
            renderApp();
        }

        function switchUser(userId) {
            let db = loadDB();
            if (db.users[userId]) {
                sessionStorage.setItem('xena_current_user_id', userId);
                currentUser = db.users[userId];
                activeChatId = null;
                renderApp();
            }
        }

        function createNewAccount(name, username, avatar) {
            let db = loadDB();
            const newId = generateXenaId();
            db.users[newId] = {
                id: newId,
                name: name || `User ${newId.slice(-4)}`,
                username: username || `user_${newId}`,
                avatar: avatar || `https://placehold.co/150/6366f1/ffffff?text=${(name||'U')[0].toUpperCase()}`,
                status: 'Online',
                bio: 'Hello on Xena Messenger!'
            };
            saveDB(db);
            switchUser(newId);
        }

        function renderApp() {
            const root = document.getElementById('app');
            let db = loadDB();

            root.innerHTML = `
                <!-- Sidebar / Navigation -->
                <div class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col h-full z-10">
                    <!-- Top User Info Bar -->
                    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="openProfileModal()">
                            <img src="${currentUser.avatar}" alt="Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500" onerror="this.src='https://placehold.co/150/6366f1/ffffff?text=X'">
                            <div>
                                <h3 class="font-semibold text-sm text-slate-200">${escapeHtml(currentUser.name)}</h3>
                                <p class="text-xs text-indigo-400 font-mono">ID: ${currentUser.id}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <!-- Pencil Menu for adding friends, groups, channels, stickers -->
                            <div class="relative">
                                <button onclick="togglePencilMenu(event)" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <div id="pencil-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-2 z-50">
                                    <button onclick="openAddFriendModal()" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-indigo-600/20 hover:text-indigo-400 flex items-center space-x-3">
                                        <i class="fa-solid fa-user-plus w-5"></i><span>Add Friend (by ID / Link)</span>
                                    </button>
                                    <button onclick="openCreateGroupModal()" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-indigo-600/20 hover:text-indigo-400 flex items-center space-x-3">
                                        <i class="fa-solid fa-users w-5"></i><span>Create Group</span>
                                    </button>
                                    <button onclick="openCreateChannelModal()" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-indigo-600/20 hover:text-indigo-400 flex items-center space-x-3">
                                        <i class="fa-solid fa-bullhorn w-5"></i><span>Create Channel</span>
                                    </button>
                                    <button onclick="openStickerCreatorModal()" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-indigo-600/20 hover:text-indigo-400 flex items-center space-x-3">
                                        <i class="fa-solid fa-face-smile w-5"></i><span>Create Sticker</span>
                                    </button>
                                    <div class="border-t border-slate-800 my-1"></div>
                                    <button onclick="openSwitchAccountModal()" class="w-full text-left px-4 py-2.5 text-sm text-amber-400 hover:bg-amber-600/20 flex items-center space-x-3">
                                        <i class="fa-solid fa-right-left w-5"></i><span>Switch / New Account</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Navigation Tabs -->
                    <div class="flex border-b border-slate-800 bg-slate-900/50">
                        <button onclick="setActiveTab('chats')" class="flex-1 py-3 text-xs font-semibold uppercase tracking-wider text-center border-b-2 ${activeTab === 'chats' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}">Chats</button>
                        <button onclick="setActiveTab('contacts')" class="flex-1 py-3 text-xs font-semibold uppercase tracking-wider text-center border-b-2 ${activeTab === 'contacts' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}">Contacts</button>
                        <button onclick="setActiveTab('stickers')" class="flex-1 py-3 text-xs font-semibold uppercase tracking-wider text-center border-b-2 ${activeTab === 'stickers' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}">Stickers</button>
                    </div>

                    <!-- Search bar -->
                    <div class="p-3">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-500"></i>
                            <input type="text" id="sidebar-search" oninput="handleSearch(this.value)" placeholder="Search chats or Xena IDs..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        </div>
                    </div>

                    <!-- Tab Content List -->
                    <div class="flex-1 overflow-y-auto" id="sidebar-list">
                        ${renderSidebarList(db)}
                    </div>
                </div>

                <!-- Main Chat Area / Content View -->
                <div class="flex-1 flex flex-col h-full bg-slate-950 relative" id="main-content-area">
                    ${activeChatId && db.chats[activeChatId] ? renderChatView(db, db.chats[activeChatId]) : renderWelcomeView(db)}
                </div>

                <!-- Active Call Overlay Modal -->
                ${callActive ? renderCallOverlay() : ''}
            `;

            // Close dropdown when clicking outside
            window.onclick = function(event) {
                if (!event.target.closest('.relative')) {
                    const dropdown = document.getElementById('pencil-dropdown');
                    if (dropdown && !dropdown.classList.contains('hidden')) {
                        dropdown.classList.add('hidden');
                    }
                }
            };
        }

        function togglePencilMenu(e) {
            e.stopPropagation();
            const dd = document.getElementById('pencil-dropdown');
            if (dd) dd.classList.toggle('hidden');
        }

        function setActiveTab(tab) {
            activeTab = tab;
            renderApp();
        }

        function renderSidebarList(db) {
            if (activeTab === 'stickers') {
                return `
                    <div class="p-4 space-y-4">
                        <div class="flex items-center justify-between">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Global Sticker Market</h4>
                            <button onclick="openStickerCreatorModal()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition">+ Create</button>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            ${db.stickers.map(s => `
                                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col items-center justify-center space-y-2 hover:border-indigo-500 transition">
                                    <img src="${s.url}" alt="${s.name}" class="w-16 h-16 object-contain rounded-lg" onerror="this.src='https://placehold.co/120/6366f1/ffffff?text=Sticker'">
                                    <span class="text-xs text-slate-300 font-medium truncate w-full text-center">${escapeHtml(s.name)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (activeTab === 'contacts') {
                const allUsers = Object.values(db.users).filter(u => u.id !== currentUser.id);
                return `
                    <div class="p-3 space-y-2">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-500 px-2 mb-2">All Xena Users</div>
                        ${allUsers.length === 0 ? '<div class="text-center py-8 text-xs text-slate-500">No other users yet. Use pencil menu to create or invite!</div>' : ''}
                        ${allUsers.map(u => `
                            <div onclick="startDirectChat('${u.id}')" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-900 cursor-pointer transition group">
                                <div class="flex items-center space-x-3">
                                    <img src="${u.avatar}" class="w-10 h-10 rounded-full object-cover border border-slate-700" onerror="this.src='https://placehold.co/150/6366f1/ffffff?text=U'">
                                    <div>
                                        <div class="text-sm font-medium text-slate-200 group-hover:text-indigo-400 transition">${escapeHtml(u.name)}</div>
                                        <div class="text-xs text-indigo-400 font-mono">ID: ${u.id}</div>
                                    </div>
                                </div>
                                <button class="w-8 h-8 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <i class="fa-solid fa-message text-xs"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Chats tab
            const userChats = Object.values(db.chats).filter(c => c.members.includes(currentUser.id));
            return `
                <div class="p-2 space-y-1">
                    ${userChats.length === 0 ? '<div class="text-center py-12 text-xs text-slate-500 px-4">No active chats. Click the pencil icon to start messaging or make friends!</div>' : ''}
                    ${userChats.map(chat => {
                        const messages = db.messages[chat.id] || [];
                        const lastMsg = messages[messages.length - 1];
                        let chatName = chat.name;
                        let chatAvatar = chat.avatar;

                        if (chat.type === 'direct') {
                            const peerId = chat.members.find(id => id !== currentUser.id);
                            const peer = db.users[peerId];
                            if (peer) {
                                chatName = peer.name;
                                chatAvatar = peer.avatar;
                            }
                        }

                        return `
                            <div onclick="selectChat('${chat.id}')" class="flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition ${activeChatId === chat.id ? 'bg-indigo-600/15 border border-indigo-500/30' : 'hover:bg-slate-900'}">
                                <div class="relative">
                                    <img src="${chatAvatar}" class="w-12 h-12 rounded-full object-cover border border-slate-700" onerror="this.src='https://placehold.co/150/6366f1/ffffff?text=C'">
                                    ${chat.type === 'group' ? '<span class="absolute -bottom-1 -right-1 bg-indigo-600 text-white text-[9px] px-1.5 py-0.5 rounded-full">Grp</span>' : ''}
                                    ${chat.type === 'channel' ? '<span class="absolute -bottom-1 -right-1 bg-emerald-600 text-white text-[9px] px-1.5 py-0.5 rounded-full">Ch</span>' : ''}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between mb-1">
                                        <h4 class="text-sm font-semibold text-slate-200 truncate">${escapeHtml(chatName)}</h4>
                                        <span class="text-[10px] text-slate-500">${lastMsg ? formatTime(lastMsg.timestamp) : ''}</span>
                                    </div>
                                    <p class="text-xs text-slate-400 truncate">${lastMsg ? escapeHtml(lastMsg.text || (lastMsg.stickerUrl ? '[Sticker]' : '[Media]')) : 'No messages yet'}</p>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderWelcomeView(db) {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-slate-950">
                    <div class="w-20 h-20 bg-indigo-600/10 rounded-2xl flex items-center justify-center text-indigo-400 text-3xl mb-4 border border-indigo-500/20">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-200 mb-2">Welcome to Xena Messenger</h2>
                    <p class="text-sm text-slate-400 max-w-sm mb-6">Select a chat from the sidebar or click the pencil menu to add friends, create groups, channels, or design stickers instantly.</p>
                    <div class="flex space-x-3">
                        <button onclick="openAddFriendModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-indigo-600/20">Add Friend</button>
                        <button onclick="openCreateGroupModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition">Create Group</button>
                    </div>
                </div>
            `;
        }

        function renderChatView(db, chat) {
            let chatName = chat.name;
            let chatAvatar = chat.avatar;
            let peerId = null;

            if (chat.type === 'direct') {
                peerId = chat.members.find(id => id !== currentUser.id);
                const peer = db.users[peerId];
                if (peer) {
                    chatName = peer.name;
                    chatAvatar = peer.avatar;
                }
            }

            const messages = db.messages[chat.id] || [];

            return `
                <!-- Chat Header -->
                <div class="px-6 py-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900/40 backdrop-blur z-10">
                    <div class="flex items-center space-x-3">
                        <img src="${chatAvatar}" class="w-10 h-10 rounded-full object-cover border border-slate-700" onerror="this.src='https://placehold.co/150/6366f1/ffffff?text=C'">
                        <div>
                            <h3 class="text-sm font-bold text-slate-200">${escapeHtml(chatName)}</h3>
                            <p class="text-xs text-slate-400">${chat.type === 'direct' ? 'Online' : chat.members.length + ' members'}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        ${chat.type === 'direct' ? `
                            <button onclick="startCall('${peerId}', 'audio')" class="w-9 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-indigo-400 flex items-center justify-center transition" title="Voice Call">
                                <i class="fa-solid fa-phone text-xs"></i>
                            </button>
                            <button onclick="startCall('${peerId}', 'video')" class="w-9 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-indigo-400 flex items-center justify-center transition" title="Video Call">
                                <i class="fa-solid fa-video text-xs"></i>
                            </button>
                        ` : ''}
                        <button onclick="openChatInfoModal('${chat.id}')" class="w-9 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-indigo-400 flex items-center justify-center transition" title="Chat Info">
                            <i class="fa-solid fa-circle-info text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="flex-1 overflow-y-auto p-6 space-y-4" id="messages-container">
                    ${messages.length === 0 ? '<div class="text-center py-12 text-xs text-slate-500">No messages yet. Send a greeting or sticker!</div>' : ''}
                    ${messages.map(msg => {
                        const isMe = msg.senderId === currentUser.id;
                        const sender = db.users[msg.senderId] || { name: 'Unknown', avatar: 'https://placehold.co/150/6366f1/ffffff?text=U' };
                        return `
                            <div class="flex ${isMe ? 'justify-end' : 'justify-start'} items-end space-x-2">
                                ${!isMe && chat.type !== 'direct' ? `<img src="${sender.avatar}" class="w-7 h-7 rounded-full object-cover mb-1" title="${escapeHtml(sender.name)}">` : ''}
                                <div class="max-w-[70%] rounded-2xl px-4 py-3 ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'}">
                                    ${!isMe && chat.type !== 'direct' ? `<div class="text-[10px] font-semibold text-indigo-400 mb-1">${escapeHtml(sender.name)}</div>` : ''}
                                    ${msg.stickerUrl ? `<img src="${msg.stickerUrl}" class="w-32 h-32 object-contain rounded-xl my-1">` : ''}
                                    ${msg.text ? `<p class="text-sm whitespace-pre-wrap break-words">${escapeHtml(msg.text)}</p>` : ''}
                                    <div class="text-[10px] ${isMe ? 'text-indigo-200' : 'text-slate-500'} text-right mt-1">${formatTime(msg.timestamp)}</div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <!-- Message Input Footer -->
                <div class="p-4 border-t border-slate-800 bg-slate-900/40 relative">
                    <!-- Sticker picker popover -->
                    <div id="sticker-picker" class="hidden absolute bottom-20 left-4 bg-slate-900 border border-slate-700 rounded-2xl p-4 shadow-2xl w-72 z-30">
                        <div class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Send Sticker</div>
                        <div class="grid grid-cols-4 gap-2 max-h-48 overflow-y-auto">
                            ${db.stickers.map(s => `
                                <img src="${s.url}" onclick="sendSticker('${s.url}')" class="w-14 h-14 object-contain rounded-xl hover:bg-slate-800 cursor-pointer p-1 transition" title="${escapeHtml(s.name)}">
                            `).join('')}
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <button onclick="toggleStickerPicker(event)" class="w-10 h-10 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-indigo-400 flex items-center justify-center transition">
                            <i class="fa-solid fa-face-smile"></i>
                        </button>
                        <input type="text" id="message-input" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="Type a message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        <button onclick="sendMessage()" class="w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition shadow-lg shadow-indigo-600/20">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Auto scroll messages to bottom when rendered
        setTimeout(() => {
            const container = document.getElementById('messages-container');
            if (container) container.scrollTop = container.scrollHeight;
        }, 50);

        function selectChat(chatId) {
            activeChatId = chatId;
            renderApp();
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function startDirectChat(peerId) {
            let db = loadDB();
            if (!db.users[peerId]) return;

            // Check if direct chat already exists
            let existingChatId = null;
            Object.values(db.chats).forEach(c => {
                if (c.type === 'direct' && c.members.includes(currentUser.id) && c.members.includes(peerId)) {
                    existingChatId = c.id;
                }
            });

            if (existingChatId) {
                selectChat(existingChatId);
            } else {
                const chatId = 'chat_' + Math.random().toString(36).substring(2, 9);
                db.chats[chatId] = {
                    id: chatId,
                    type: 'direct',
                    name: db.users[peerId].name,
                    avatar: db.users[peerId].avatar,
                    members: [currentUser.id, peerId]
                };
                saveDB(db);
                selectChat(chatId);
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input || !input.value.trim() || !activeChatId) return;

            let db = loadDB();
            if (!db.messages[activeChatId]) db.messages[activeChatId] = [];

            db.messages[activeChatId].push({
                id: 'msg_' + Math.random().toString(36).substring(2, 9),
                senderId: currentUser.id,
                text: input.value.trim(),
                timestamp: Date.now()
            });

            saveDB(db);
            input.value = '';
            renderApp();
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function sendSticker(stickerUrl) {
            if (!activeChatId) return;
            let db = loadDB();
            if (!db.messages[activeChatId]) db.messages[activeChatId] = [];

            db.messages[activeChatId].push({
                id: 'msg_' + Math.random().toString(36).substring(2, 9),
                senderId: currentUser.id,
                stickerUrl: stickerUrl,
                timestamp: Date.now()
            });

            saveDB(db);
            toggleStickerPicker({ stopPropagation: () => {} });
            renderApp();
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function toggleStickerPicker(e) {
            e.stopPropagation();
            const picker = document.getElementById('sticker-picker');
            if (picker) picker.classList.toggle('hidden');
        }

        function showModal(title, contentHtml) {
            const modalRoot = document.getElementById('modal-root');
            modalRoot.innerHTML = `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
                        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                            <h3 class="font-bold text-slate-200">${escapeHtml(title)}</h3>
                            <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="p-6">${contentHtml}</div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-root').innerHTML = '';
        }

        function openAddFriendModal() {
            const shareableLink = window.location.origin + window.location.pathname + '#user=' + currentUser.id;
            showModal('Add Friend', `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Connect by 10-Digit Xena ID</label>
                        <div class="flex space-x-2">
                            <input type="text" id="friend-id-input" placeholder="e.g. 0000000002" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                            <button onclick="connectFriendById()" class="px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition">Connect</button>
                        </div>
                    </div>
                    <div class="border-t border-slate-800 pt-4">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Your Shareable Xena Link / ID</label>
                        <div class="flex space-x-2">
                            <input type="text" readonly value="${shareableLink}" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-indigo-400 font-mono focus:outline-none">
                            <button onclick="copyShareableLink('${shareableLink}')" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-copy"></i></button>
                        </div>
                    </div>
                </div>
            `);
        }

        function connectFriendById() {
            const input = document.getElementById('friend-id-input');
            if (!input) return;
            const friendId = input.value.trim();
            let db = loadDB();

            if (!db.users[friendId]) {
                alertUser('User with ID ' + friendId + ' not found in local network.');
                return;
            }
            if (friendId === currentUser.id) {
                alertUser('You cannot add yourself as a friend.');
                return;
            }

            closeModal();
            startDirectChat(friendId);
        }

        function copyShareableLink(link) {
            document.execCommand('copy');
            alertUser('Link copied to clipboard!');
        }

        function openCreateGroupModal() {
            let db = loadDB();
            const allUsers = Object.values(db.users).filter(u => u.id !== currentUser.id);

            showModal('Create Group Chat', `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Group Name</label>
                        <input type="text" id="group-name-input" placeholder="e.g. Project Xena" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Members</label>
                        <div class="max-h-48 overflow-y-auto space-y-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                            ${allUsers.map(u => `
                                <label class="flex items-center space-x-3 p-2 rounded-lg hover:bg-slate-900 cursor-pointer">
                                    <input type="checkbox" value="${u.id}" class="group-member-checkbox rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500">
                                    <img src="${u.avatar}" class="w-8 h-8 rounded-full object-cover">
                                    <span class="text-sm text-slate-200">${escapeHtml(u.name)}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                    <button onclick="submitCreateGroup()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">Create Group</button>
                </div>
            `);
        }

        function submitCreateGroup() {
            const nameInput = document.getElementById('group-name-input');
            if (!nameInput || !nameInput.value.trim()) return;

            const checkboxes = document.querySelectorAll('.group-member-checkbox:checked');
            const members = [currentUser.id];
            checkboxes.forEach(cb => members.push(cb.value));

            let db = loadDB();
            const chatId = 'group_' + Math.random().toString(36).substring(2, 9);
            db.chats[chatId] = {
                id: chatId,
                type: 'group',
                name: nameInput.value.trim(),
                avatar: `https://placehold.co/150/f59e0b/ffffff?text=${nameInput.value.trim()[0].toUpperCase()}`,
                members: members,
                adminId: currentUser.id
            };

            saveDB(db);
            closeModal();
            selectChat(chatId);
        }

        function openCreateChannelModal() {
            showModal('Create Public Channel', `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Channel Name</label>
                        <input type="text" id="channel-name-input" placeholder="e.g. Xena Announcements" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Description</label>
                        <textarea id="channel-desc-input" placeholder="What is this channel about?" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 h-24 resize-none"></textarea>
                    </div>
                    <button onclick="submitCreateChannel()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">Create Channel</button>
                </div>
            `);
        }

        function submitCreateChannel() {
            const nameInput = document.getElementById('channel-name-input');
            if (!nameInput || !nameInput.value.trim()) return;

            let db = loadDB();
            // All current users automatically join channels as subscribers
            const members = Object.keys(db.users);
            const chatId = 'channel_' + Math.random().toString(36).substring(2, 9);

            db.chats[chatId] = {
                id: chatId,
                type: 'channel',
                name: nameInput.value.trim(),
                avatar: `https://placehold.co/150/10b981/ffffff?text=${nameInput.value.trim()[0].toUpperCase()}`,
                members: members,
                adminId: currentUser.id
            };

            saveDB(db);
            closeModal();
            selectChat(chatId);
        }

        function openStickerCreatorModal() {
            showModal('Global Sticker Creator', `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Sticker Name</label>
                        <input type="text" id="sticker-name-input" placeholder="e.g. Cool Cat" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Emoji or Icon Text</label>
                        <input type="text" id="sticker-emoji-input" placeholder="🚀" maxlength="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 text-center text-2xl">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Background Color</label>
                        <select id="sticker-color-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="6366f1">Indigo</option>
                            <option value="f43f5e">Rose</option>
                            <option value="10b981">Emerald</option>
                            <option value="f59e0b">Amber</option>
                            <option value="8b5cf6">Purple</option>
                        </select>
                    </div>
                    <button onclick="submitCreateSticker()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">Publish Sticker</button>
                </div>
            `);
        }

        function submitCreateSticker() {
            const name = document.getElementById('sticker-name-input').value.trim();
            const emoji = document.getElementById('sticker-emoji-input').value.trim() || '⭐';
            const color = document.getElementById('sticker-color-input').value;

            if (!name) return;

            let db = loadDB();
            const stickerUrl = `https://placehold.co/120/${color}/ffffff?text=${encodeURIComponent(emoji)}`;
            db.stickers.push({
                id: 'stk_' + Math.random().toString(36).substring(2, 9),
                name: name,
                url: stickerUrl
            });

            saveDB(db);
            closeModal();
            alertUser('Sticker created and published globally!');
        }

        function openProfileModal() {
            showModal('My Profile', `
                <div class="space-y-4 text-center">
                    <img src="${currentUser.avatar}" class="w-24 h-24 rounded-full object-cover mx-auto border-4 border-indigo-500" onerror="this.src='https://placehold.co/150/6366f1/ffffff?text=X'">
                    <div>
                        <h4 class="text-lg font-bold text-slate-200">${escapeHtml(currentUser.name)}</h4>
                        <p class="text-xs text-indigo-400 font-mono mt-1">Xena ID: ${currentUser.id}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1 text-left">Display Name</label>
                        <input type="text" id="profile-name-edit" value="${escapeHtml(currentUser.name)}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="saveProfile()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">Save Changes</button>
                </div>
            `);
        }

        function saveProfile() {
            const nameInput = document.getElementById('profile-name-edit');
            if (!nameInput || !nameInput.value.trim()) return;

            let db = loadDB();
            db.users[currentUser.id].name = nameInput.value.trim();
            saveDB(db);
            closeModal();
            refreshAppState();
        }

        function openSwitchAccountModal() {
            let db = loadDB();
            const users = Object.values(db.users);

            showModal('Switch or Create Account', `
                <div class="space-y-4">
                    <div class="space-y-2 max-h-48 overflow-y-auto">
                        ${users.map(u => `
                            <div onclick="switchUser('${u.id}'); closeModal();" class="flex items-center justify-between p-3 rounded-xl bg-slate-950 hover:bg-slate-800 cursor-pointer border ${u.id === currentUser.id ? 'border-indigo-500' : 'border-slate-800'} transition">
                                <div class="flex items-center space-x-3">
                                    <img src="${u.avatar}" class="w-10 h-10 rounded-full object-cover">
                                    <div>
                                        <div class="text-sm font-medium text-slate-200">${escapeHtml(u.name)}</div>
                                        <div class="text-xs text-indigo-400 font-mono">ID: ${u.id}</div>
                                    </div>
                                </div>
                                ${u.id === currentUser.id ? '<span class="text-xs text-indigo-400 font-semibold">Active</span>' : ''}
                            </div>
                        `).join('')}
                    </div>
                    <div class="border-t border-slate-800 pt-4">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Create New Account</label>
                        <div class="flex space-x-2">
                            <input type="text" id="new-acc-name" placeholder="Your Name" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                            <button onclick="submitNewAccount()" class="px-4 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition">Create</button>
                        </div>
                    </div>
                </div>
            `);
        }

        function submitNewAccount() {
            const name = document.getElementById('new-acc-name').value.trim();
            closeModal();
            createNewAccount(name);
        }

        function openChatInfoModal(chatId) {
            let db = loadDB();
            const chat = db.chats[chatId];
            if (!chat) return;

            showModal('Chat Information', `
                <div class="space-y-4 text-center">
                    <img src="${chat.avatar}" class="w-20 h-20 rounded-full object-cover mx-auto border-2 border-indigo-500">
                    <div>
                        <h4 class="text-lg font-bold text-slate-200">${escapeHtml(chat.name)}</h4>
                        <p class="text-xs text-slate-400 uppercase tracking-wider mt-1">${chat.type} chat</p>
                    </div>
                    <div class="text-left">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Members (${chat.members.length})</label>
                        <div class="max-h-36 overflow-y-auto space-y-1 bg-slate-950 p-2 rounded-xl border border-slate-800">
                            ${chat.members.map(mId => {
                                const mUser = db.users[mId];
                                return mUser ? `<div class="text-xs text-slate-300 py-1 px-2 flex items-center justify-between"><span>${escapeHtml(mUser.name)}</span><span class="text-indigo-400 font-mono">${mUser.id}</span></div>` : '';
                            }).join('')}
                        </div>
                    </div>
                </div>
            `);
        }

        function startCall(peerId, type) {
            let db = loadDB();
            const peer = db.users[peerId];
            if (!peer) return;

            callActive = true;
            callPeer = peer;
            callType = type;
            callTimer = 0;
            renderApp();

            callInterval = setInterval(() => {
                callTimer++;
                const timerEl = document.getElementById('call-timer');
                if (timerEl) {
                    const mins = Math.floor(callTimer / 60).toString().padStart(2, '0');
                    const secs = (callTimer % 60).toString().padStart(2, '0');
                    timerEl.innerText = `${mins}:${secs}`;
                }
            }, 1000);
        }

        function endCall() {
            callActive = false;
            callPeer = null;
            if (callInterval) clearInterval(callInterval);
            renderApp();
        }

        function renderCallOverlay() {
            return `
                <div class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-between p-12 z-50 animate-fade-in">
                    <div class="text-center space-y-2 mt-8">
                        <span class="text-xs uppercase tracking-widest text-indigo-400 font-semibold">Xena Secure ${callType === 'video' ? 'Video' : 'Voice'} Call</span>
                        <h2 class="text-2xl font-bold text-slate-100">${escapeHtml(callPeer ? callPeer.name : 'Unknown')}</h2>
                        <p id="call-timer" class="text-sm font-mono text-slate-400">00:00</p>
                    </div>

                    <div class="relative flex items-center justify-center my-auto">
                        <div class="absolute w-48 h-48 rounded-full bg-indigo-600/20 pulse-ring"></div>
                        <img src="${callPeer ? callPeer.avatar : 'https://placehold.co/150/6366f1/ffffff?text=U'}" class="w-32 h-32 rounded-full object-cover border-4 border-indigo-500 shadow-2xl relative z-10" onerror="this.src='https://placehold.co/150/6366f1/ffffff?text=U'">
                    </div>

                    <div class="flex items-center space-x-6 mb-8">
                        <button onclick="endCall()" class="w-16 h-16 rounded-full bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center text-xl shadow-lg shadow-rose-600/30 transition transform hover:scale-105">
                            <i class="fa-solid fa-phone-slash"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Utilities
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function alertUser(msg) {
            showModal('Notice', `<p class="text-sm text-slate-300 mb-6">${escapeHtml(msg)}</p><button onclick="closeModal()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">OK</button>`);
        }

        function handleSearch(query) {
            // Future search filter or sidebar list filter
        }

        // Initialize on load
        window.onload = () => {
            initApp();
        };
    </script>

</body>
</html>
