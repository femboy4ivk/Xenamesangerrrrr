<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased overflow-hidden transition-colors duration-200">

    <div id="app" class="h-full w-full flex flex-col"></div>

    <script>
        const DB = {
            getUsers() {
                try { return JSON.parse(localStorage.getItem('xena_users')) || []; } catch(e){ return []; }
            },
            saveUsers(users) { localStorage.setItem('xena_users', JSON.stringify(users)); },
            getCurrentUser() {
                try { return JSON.parse(localStorage.getItem('xena_current_user')) || null; } catch(e){ return null; }
            },
            setCurrentUser(user) {
                if (user) localStorage.setItem('xena_current_user', JSON.stringify(user));
                else localStorage.removeItem('xena_current_user');
            },
            getMessages() {
                try { return JSON.parse(localStorage.getItem('xena_messages')) || []; } catch(e){ return []; }
            },
            saveMessages(messages) { localStorage.setItem('xena_messages', JSON.stringify(messages)); },
            getGroups() {
                try { return JSON.parse(localStorage.getItem('xena_groups')) || []; } catch(e){ return []; }
            },
            saveGroups(groups) { localStorage.setItem('xena_groups', JSON.stringify(groups)); },
            getStickers() {
                try { 
                    const custom = JSON.parse(localStorage.getItem('xena_stickers')) || [];
                    // Default built-in stickers
                    const defaults = [
                        { id: 'st_1', name: 'Огонь', url: 'https://placehold.co/120x120/22c55e/ffffff?text=🔥' },
                        { id: 'st_2', name: 'Сердце', url: 'https://placehold.co/120x120/ef4444/ffffff?text=❤️' },
                        { id: 'st_3', name: 'Смех', url: 'https://placehold.co/120x120/eab308/ffffff?text=😂' },
                        { id: 'st_4', name: 'Палец вверх', url: 'https://placehold.co/120x120/3b82f6/ffffff?text=👍' },
                        { id: 'st_5', name: 'Ракета', url: 'https://placehold.co/120x120/a855f7/ffffff?text=🚀' },
                        { id: 'st_6', name: 'Единорог', url: 'https://placehold.co/120x120/ec4899/ffffff?text=🦄' }
                    ];
                    return [...defaults, ...custom];
                } catch(e){ return []; }
            },
            saveSticker(sticker) {
                try {
                    const custom = JSON.parse(localStorage.getItem('xena_stickers')) || [];
                    custom.push(sticker);
                    localStorage.setItem('xena_stickers', JSON.stringify(custom));
                } catch(e){}
            },
            getNextUserId() {
                const users = this.getUsers();
                if (users.length === 0) return '0000000001';
                // Find max ID converted to integer
                let maxId = 0;
                users.forEach(u => {
                    const num = parseInt(u.id, 10);
                    if (!isNaN(num) && num > maxId) maxId = num;
                });
                const nextNum = maxId + 1;
                return String(nextNum).padStart(10, '0');
            },
            updateUser(updatedUser) {
                let users = this.getUsers();
                users = users.map(u => u.id === updatedUser.id ? updatedUser : u);
                this.saveUsers(users);
                const curr = this.getCurrentUser();
                if (curr && curr.id === updatedUser.id) {
                    this.setCurrentUser(updatedUser);
                }
            }
        };

        // Cross-tab synchronization via storage events and polling
        window.addEventListener('storage', (e) => {
            if (['xena_users', 'xena_messages', 'xena_groups', 'xena_current_user', 'xena_stickers'].includes(e.key)) {
                renderApp();
            }
        });

        setInterval(() => {
            const currentUser = DB.getCurrentUser();
            if (currentUser) {
                const users = DB.getUsers();
                const freshUser = users.find(u => u.id === currentUser.id);
                if (freshUser && JSON.stringify(freshUser) !== JSON.stringify(currentUser)) {
                    DB.setCurrentUser(freshUser);
                    renderApp();
                } else {
                    const messages = DB.getMessages();
                    if (messages.length !== (window._lastMsgCount || 0)) {
                        window._lastMsgCount = messages.length;
                        renderApp();
                    }
                }
            }
        }, 1000);

        let activeTab = 'chats'; // 'chats', 'search', 'requests', 'groups', 'stickers', 'profile'
        let activeChatId = null; 
        let authMode = 'login';
        let notificationMessage = null;
        let activeCall = null; 
        let isStickersOpen = false; // toggle sticker picker in chat

        function showNotification(msg, type = 'success') {
            notificationMessage = { text: msg, type };
            renderApp();
            setTimeout(() => {
                if (notificationMessage && notificationMessage.text === msg) {
                    notificationMessage = null;
                    renderApp();
                }
            }, 3500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('add');
            if (targetId) {
                window._pendingFriendLinkId = targetId;
            }
            renderApp();
        });

        function renderApp() {
            const app = document.getElementById('app');
            const currentUser = DB.getCurrentUser();

            if (currentUser && window._pendingFriendLinkId) {
                const targetId = window._pendingFriendLinkId;
                window._pendingFriendLinkId = null;
                window.history.replaceState({}, document.title, window.location.pathname);
                if (targetId !== currentUser.id) {
                    autoSendFriendRequest(targetId);
                }
            }

            if (!currentUser) {
                app.innerHTML = renderAuthScreen();
                return;
            }

            if (currentUser.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            app.innerHTML = `
                ${notificationMessage ? renderToast(notificationMessage) : ''}
                ${activeCall ? renderCallModal() : ''}
                <div class="flex h-full w-full overflow-hidden relative">
                    <!-- Sidebar Navigation -->
                    <aside class="w-20 md:w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between shrink-0 z-20 transition-colors">
                        <div class="flex flex-col h-full">
                            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white font-bold text-lg shadow-md shrink-0">
                                        ${currentUser.avatar ? `<img src="${currentUser.avatar}" class="w-full h-full object-cover rounded-xl">` : currentUser.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="hidden md:block truncate">
                                        <h2 class="font-semibold text-sm truncate">${escapeHtml(currentUser.name)}</h2>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate">ID: ${currentUser.id}</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button onclick="openPencilMenu()" title="Создать / Добавить друга" class="text-slate-500 hover:text-brand-500 transition p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                                        <i class="fa-solid fa-pen-to-square text-lg"></i>
                                    </button>
                                    <button onclick="handleLogout()" title="Выйти" class="hidden md:flex text-slate-400 hover:text-red-500 transition p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                                        <i class="fa-solid fa-right-from-bracket"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Tabs Navigation -->
                            <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
                                <button onclick="switchTab('chats')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'chats' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-comments text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Чаты</span>
                                </button>
                                <button onclick="switchTab('groups')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'groups' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-users text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Группы / Каналы</span>
                                </button>
                                <button onclick="switchTab('stickers')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'stickers' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-face-smile text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Стикеры</span>
                                </button>
                                <button onclick="switchTab('search')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'search' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-link text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Добавить по ссылке</span>
                                </button>
                                <button onclick="switchTab('requests')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition relative ${activeTab === 'requests' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-bell text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Заявки в друзья</span>
                                    ${(currentUser.friendRequests && currentUser.friendRequests.length > 0) ? `
                                        <span class="absolute right-3 top-3 md:static bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">${currentUser.friendRequests.length}</span>
                                    ` : ''}
                                </button>
                                <button onclick="switchTab('profile')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'profile' ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid fa-user-gear text-lg w-6 text-center"></i>
                                    <span class="hidden md:inline">Профиль и ID</span>
                                </button>
                            </nav>
                        </div>

                        <div class="p-3 border-t border-slate-200 dark:border-slate-800 md:hidden flex justify-center">
                            <button onclick="handleLogout()" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl">
                                <i class="fa-solid fa-right-from-bracket text-lg"></i>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content Workspace -->
                    <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-900 overflow-hidden">
                        ${renderMainContent(currentUser)}
                    </main>
                </div>

                <!-- Pencil Action Modal (Group, Channel, Add friend by ID) -->
                <div id="pencil-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold text-lg">Быстрое меню действий</h3>
                            <button onclick="closePencilMenu()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                        <div class="space-y-3">
                            <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700">
                                <h4 class="font-semibold text-sm mb-1"><i class="fa-solid fa-user-plus text-brand-500 mr-2"></i>Добавить друга по ID</h4>
                                <p class="text-xs text-slate-500 mb-2">Введите 10-значный ID пользователя, чтобы отправить ему заявку:</p>
                                <div class="flex gap-2">
                                    <input type="text" id="pencil-friend-id" placeholder="0000000002" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:border-brand-500">
                                    <button onclick="submitFriendByIdFromPencil()" class="px-4 py-2 bg-brand-500 text-white text-xs font-semibold rounded-lg hover:bg-brand-600 transition">Добавить</button>
                                </div>
                            </div>

                            <div class="flex gap-2 pt-2">
                                <button onclick="closePencilMenu(); openCreateGroupModal();" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold text-xs rounded-xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-users-rectangle text-brand-500"></i>
                                    <span>Создать группу</span>
                                </button>
                                <button onclick="closePencilMenu(); switchTab('stickers');" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold text-xs rounded-xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-face-smile text-brand-500"></i>
                                    <span>Создать стикер</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openPencilMenu() {
            const modal = document.getElementById('pencil-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closePencilMenu() {
            const modal = document.getElementById('pencil-modal');
            if (modal) modal.classList.add('hidden');
        }

        function submitFriendByIdFromPencil() {
            const input = document.getElementById('pencil-friend-id');
            const targetId = (input.value || '').trim();
            if (!targetId) {
                showNotification('Введите ID пользователя', 'error');
                return;
            }
            closePencilMenu();
            autoSendFriendRequest(targetId);
        }

        function renderAuthScreen() {
            return `
                <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-950 dark:to-slate-900 p-4">
                    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-brand-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-brand-500/30 mb-4">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight">Xena Messenger</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Реальные ID от 0000000001 и стикерпаки</p>
                        </div>

                        <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl mb-6">
                            <button onclick="setAuthMode('login')" class="flex-1 py-2 text-sm font-medium rounded-lg transition ${authMode === 'login' ? 'bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}">
                                Вход
                            </button>
                            <button onclick="setAuthMode('register')" class="flex-1 py-2 text-sm font-medium rounded-lg transition ${authMode === 'register' ? 'bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}">
                                Регистрация
                            </button>
                        </div>

                        <form class="space-y-4" onsubmit="handleAuthSubmit(event)">
                            ${authMode === 'register' ? `
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Имя пользователя</label>
                                    <input type="text" id="auth-name" required placeholder="Иван Иванов" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 transition text-sm">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Email или Ваш ID (например 0000000001)</label>
                                <input type="text" id="auth-email" required placeholder="0000000001 или email@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 transition text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Пароль</label>
                                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-brand-500 transition text-sm">
                            </div>

                            <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 transition mt-2">
                                ${authMode === 'login' ? 'Войти' : 'Зарегистрироваться'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function setAuthMode(mode) {
            authMode = mode;
            renderApp();
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const identifier = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            let users = DB.getUsers();

            if (authMode === 'register') {
                const name = document.getElementById('auth-name').value.trim();
                const newUserId = DB.getNextUserId();
                const newUser = {
                    id: newUserId,
                    name,
                    email: identifier,
                    password,
                    bio: 'Привет! Мой ID в Xena: ' + newUserId,
                    avatar: '',
                    darkMode: false,
                    friends: [],
                    friendRequests: [],
                    sentRequests: []
                };

                users.push(newUser);
                DB.saveUsers(users);
                DB.setCurrentUser(newUser);
                showNotification('Регистрация успешна! Ваш ID: ' + newUserId);
                renderApp();
            } else {
                const user = users.find(u => (u.email.toLowerCase() === identifier.toLowerCase() || u.id === identifier) && u.password === password);
                if (user) {
                    DB.setCurrentUser(user);
                    showNotification('С возвращением, ' + user.name + '!');
                    renderApp();
                } else {
                    showNotification('Неверный логин, ID или пароль', 'error');
                }
            }
        }

        function handleLogout() {
            DB.setCurrentUser(null);
            activeChatId = null;
            activeTab = 'chats';
            showNotification('Вы вышли из системы');
            renderApp();
        }

        function renderMainContent(currentUser) {
            currentUser.friends = currentUser.friends || [];
            currentUser.friendRequests = currentUser.friendRequests || [];
            currentUser.sentRequests = currentUser.sentRequests || [];

            if (activeTab === 'search') {
                return renderLinkSearchTab(currentUser);
            } else if (activeTab === 'requests') {
                return renderRequestsTab(currentUser);
            } else if (activeTab === 'groups') {
                return renderGroupsTab(currentUser);
            } else if (activeTab === 'stickers') {
                return renderStickersTab(currentUser);
            } else if (activeTab === 'profile') {
                return renderProfileTab(currentUser);
            } else {
                return renderChatsTab(currentUser);
            }
        }

        function renderChatsTab(currentUser) {
            const groups = DB.getGroups().filter(g => g.members && g.members.includes(currentUser.id));

            return `
                <div class="flex h-full w-full overflow-hidden">
                    <div class="${activeChatId ? 'hidden md:flex' : 'flex'} w-full md:w-80 lg:w-96 flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                            <h2 class="font-bold text-lg">Чаты</h2>
                            <span class="text-xs bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 px-2.5 py-1 rounded-full font-medium">
                                ${currentUser.friends.length + groups.length} диалогов
                            </span>
                        </div>
                        <div class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/60">
                            ${(currentUser.friends.length === 0 && groups.length === 0) ? `
                                <div class="p-8 text-center text-slate-400">
                                    <i class="fa-solid fa-comments text-4xl mb-3 opacity-50"></i>
                                    <p class="text-sm font-medium">Список чатов пуст</p>
                                    <p class="text-xs mt-1">Используйте кнопку карандаша или добавьте друга по ID.</p>
                                </div>
                            ` : ''}

                            <!-- Group chats -->
                            ${groups.map(group => {
                                const isSelected = activeChatId === group.id;
                                const lastMsg = getLastGroupMessage(group.id);
                                return `
                                    <div onclick="openChat('${group.id}', true)" class="flex items-center space-x-3 p-4 cursor-pointer transition hover:bg-slate-50 dark:hover:bg-slate-800/50 ${isSelected ? 'bg-slate-100 dark:bg-slate-800' : ''}">
                                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white font-bold shrink-0 shadow">
                                            <i class="fa-solid fa-users"></i>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center justify-between mb-1">
                                                <h3 class="font-semibold text-sm truncate">${escapeHtml(group.name)}</h3>
                                                ${lastMsg ? `<span class="text-[10px] text-slate-400">${formatTime(lastMsg.timestamp)}</span>` : ''}
                                            </div>
                                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">
                                                ${lastMsg ? escapeHtml(lastMsg.senderName + ': ' + (lastMsg.type === 'sticker' ? '[Стикер]' : lastMsg.text)) : 'Группа'}
                                            </p>
                                        </div>
                                    </div>
                                `;
                            }).join('')}

                            <!-- Direct chats with friends -->
                            ${currentUser.friends.map(friendId => {
                                const users = DB.getUsers();
                                const friend = users.find(u => u.id === friendId);
                                if (!friend) return '';

        function copyMyFriendLink(link) {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = link;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showNotification('Ссылка скопирована в буфер обмена!');

        function submitFriendByLink() {
            const query = (window._linkQuery || '').trim();
            if (!query) {
                showNotification('Введите ID или ссылку', 'error');
                return;
            }

            let targetId = query;
            if (query.includes('add=')) {
                try {
                    const url = new URL(query.includes('http') ? query : 'http://localhost/?' + query.split('?')[1]);
                    targetId = url.searchParams.get('add');
                } catch(e) {
                    const parts = query.split('add=');
                    if (parts[1]) targetId = parts[1].split('&')[0];
                }
            }

            autoSendFriendRequest(targetId);
            window._linkQuery = '';
            renderApp();
        }

        function autoSendFriendRequest(targetUserId) {
            let users = DB.getUsers();
            let currentUser = DB.getCurrentUser();

            targetUserId = targetUserId.trim();

            if (targetUserId === currentUser.id) {
                showNotification('Нельзя отправить заявку самому себе!', 'error');
                return;
            }

            const targetUser = users.find(u => u.id === targetUserId);
            if (!targetUser) {
                showNotification('Пользователь с ID ' + targetUserId + ' не найден в системе!', 'error');
                return;
            }

            if (currentUser.friends && currentUser.friends.includes(targetUserId)) {
                showNotification('Этот пользователь уже у вас в друзьях!', 'error');
                return;
            }

            targetUser.friendRequests = targetUser.friendRequests || [];
            if (!targetUser.friendRequests.includes(currentUser.id)) {
                targetUser.friendRequests.push(currentUser.id);
            }

            currentUser.sentRequests = currentUser.sentRequests || [];
            if (!currentUser.sentRequests.includes(targetUser.id)) {
                currentUser.sentRequests.push(targetUser.id);
            }

            DB.updateUser(targetUser);
            DB.updateUser(currentUser);

            showNotification('Заявка пользователю ' + targetUser.name + ' (' + targetUser.id + ') отправлена!');
            activeTab = 'chats';
            renderApp();
        }

                                                <p class="text-xs text-slate-500 font-mono">ID: ${sender.id}</p>

        function acceptFriendRequest(senderId) {
            let users = DB.getUsers();
            let currentUser = DB.getCurrentUser();
            const sender = users.find(u => u.id === senderId);

            if (!sender) return;

            currentUser.friends = currentUser.friends || [];
            if (!currentUser.friends.includes(sender.id)) currentUser.friends.push(sender.id);

            sender.friends = sender.friends || [];
            if (!sender.friends.includes(currentUser.id)) sender.friends.push(currentUser.id);

            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            sender.sentRequests = (sender.sentRequests || []).filter(id => id !== currentUser.id);

            DB.updateUser(currentUser);
            DB.updateUser(sender);

            showNotification('Вы добавили ' + sender.name + ' в друзья!');
            activeChatId = sender.id;
            activeTab = 'chats';
            renderApp();
        }

        function rejectFriendRequest(senderId) {
            let users = DB.getUsers();
            let currentUser = DB.getCurrentUser();
            const sender = users.find(u => u.id === senderId);

            currentUser.friendRequests = currentUser.friendRequests.filter(id => id !== senderId);
            if (sender) {
                sender.sentRequests = (sender.sentRequests || []).filter(id => id !== currentUser.id);
                DB.updateUser(sender);
            }

            DB.updateUser(currentUser);
            showNotification('Заявка отклонена');
            renderApp();

                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">URL аватара</label>
                                        <input type="text" id="profile-avatar" value="${escapeHtml(currentUser.avatar || '')}" placeholder="https://example.com/avatar.jpg" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:border-brand-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Статус</label>
                                        <textarea id="profile-bio" rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:border-brand-500">${escapeHtml(currentUser.bio || '')}</textarea>
                                    </div>

                                    <div class="flex items-center justify-between py-2 border-t border-slate-200 dark:border-slate-800">
                                        <div>
                                            <h4 class="font-semibold text-sm">Темная тема</h4>
                                            <p class="text-xs text-slate-500">Ночной режим интерфейса</p>
                                        </div>
                                        <input type="checkbox" id="profile-darkmode" ${currentUser.darkMode ? 'checked' : ''} class="w-5 h-5 accent-brand-500 rounded cursor-pointer">
                                    </div>

                                    <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl shadow-lg transition">
                                        Сохранить настройки
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleProfileUpdate(e) {
            e.preventDefault();
            let currentUser = DB.getCurrentUser();
            currentUser.name = document.getElementById('profile-name').value.trim();
            currentUser.avatar = document.getElementById('profile-avatar').value.trim();
            currentUser.bio = document.getElementById('profile-bio').value.trim();
            currentUser.darkMode = document.getElementById('profile-darkmode').checked;

            DB.updateUser(currentUser);
            showNotification('Профиль успешно обновлен!');
            renderApp();
        }

        function renderActiveChatWindow(currentUser, chatId) {
            const isGroup = chatId.startsWith('g_');
            let chatName = '';
            let chatAvatarOrIcon = '';
            let isMember = true;

            if (isGroup) {
                const group = DB.getGroups().find(g => g.id === chatId);
                if (!group) return '';
                chatName = group.name;
                chatAvatarOrIcon = '<i class="fa-solid fa-users"></i>';
                isMember = group.members.includes(currentUser.id);
            } else {
                const users = DB.getUsers();
                const friend = users.find(u => u.id === chatId);
                if (!friend) return '';
                chatName = friend.name;
                chatAvatarOrIcon = friend.avatar ? `<img src="${friend.avatar}" class="w-full h-full object-cover">` : friend.name.charAt(0).toUpperCase();
            }

            const messages = getConversationMessages(currentUser.id, chatId, isGroup);
            const stickers = DB.getStickers();

            return `
                <div class="flex flex-col h-full bg-white dark:bg-slate-900 relative">
                    <!-- Chat Top Header -->
                    <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between z-10">
                        <div class="flex items-center space-x-3">
                            <button onclick="closeActiveChat()" class="md:hidden text-slate-500 hover:text-slate-800 p-2">
                                <i class="fa-solid fa-arrow-left text-lg"></i>
                            </button>
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white font-bold shadow overflow-hidden">
                                ${chatAvatarOrIcon}
                            </div>
                            <div>
                                <h3 class="font-semibold text-sm">${escapeHtml(chatName)}</h3>
                                <p class="text-xs text-slate-500">${isGroup ? 'Групповой чат' : 'В сети'}</p>
                            </div>
                        </div>

                        ${!isGroup ? `
                            <div class="flex items-center space-x-2">
                                <button onclick="startCall('${escapeHtml(chatName)}', 'audio')" title="Аудиозвонок" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition">
                                    <i class="fa-solid fa-phone text-sm"></i>
                                </button>
                                <button onclick="startCall('${escapeHtml(chatName)}', 'video')" title="Видеозвонок" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition">
                                    <i class="fa-solid fa-video text-sm"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Messages Container -->
                    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50 dark:bg-slate-950/50">
                        ${messages.length === 0 ? `
                            <div class="h-full flex flex-col items-center justify-center text-center text-slate-400">
                                <i class="fa-regular fa-paper-plane text-3xl mb-2 opacity-50"></i>
                                <p class="text-sm font-medium">История сообщений пуста</p>
                                <p class="text-xs">Отправьте первое сообщение или стикер</p>
                            </div>
                        ` : messages.map(msg => {
                            const isMe = msg.senderId === currentUser.id;
                            return `
                                <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                                    <div class="max-w-xs md:max-w-md rounded-2xl px-4 py-2.5 shadow-sm ${isMe ? 'bg-brand-500 text-white rounded-br-none' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-bl-none'}">
                                        ${isGroup && !isMe ? `<div class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 mb-1">${escapeHtml(msg.senderName)}</div>` : ''}
                                        ${msg.type === 'sticker' ? `
                                            <img src="${escapeHtml(msg.stickerUrl)}" class="w-32 h-32 object-cover rounded-xl my-1 shadow">
                                        ` : `
                                            <p class="text-sm break-words">${escapeHtml(msg.text)}</p>
                                        `}
                                        <div class="text-[10px] mt-1 text-right ${isMe ? 'text-brand-100' : 'text-slate-400'}">
                                            ${formatTime(msg.timestamp)}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Stickers Popup Picker -->
                    ${isStickersOpen ? `
                        <div class="absolute bottom-20 left-4 right-4 md:left-auto md:right-4 md:w-80 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-2xl z-30 max-h-60 overflow-y-auto">
                            <div class="flex items-center justify-between mb-3">
                                <span class="font-bold text-xs uppercase tracking-wider text-slate-500">Стикеры</span>
                                <button onclick="toggleStickersPicker()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                ${stickers.map(st => `
                                    <button onclick="sendStickerMessage('${chatId}', ${isGroup}, '${escapeHtml(st.url)}')" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl flex flex-col items-center transition">
                                        <img src="${escapeHtml(st.url)}" class="w-14 h-14 object-cover rounded-lg mb-1" onerror="this.src='https://placehold.co/80x80/22c55e/ffffff?text=Sticker'">
                                        <span class="text-[10px] truncate w-full text-center text-slate-600 dark:text-slate-400">${escapeHtml(st.name)}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- Message Input Form -->
                    <form onsubmit="handleSendMessage(event, '${chatId}', ${isGroup})" class="p-3 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center space-x-2 z-10">
                        <button type="button" onclick="toggleStickersPicker()" title="Стикеры" class="p-3 text-slate-500 hover:text-brand-500 transition">
                            <i class="fa-solid fa-face-smile text-xl"></i>
                        </button>
                        <input type="text" id="chat-input" placeholder="Введите сообщение..." autocomplete="off" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:border-brand-500 transition text-sm">
                        <button type="submit" class="w-12 h-12 bg-brand-500 hover:bg-brand-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-brand-500/20 transition shrink-0">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </div>
            `;
        }

        function toggleStickersPicker() {
            isStickersOpen = !isStickersOpen;
            renderApp();
            scrollToBottom();
        }

        function sendStickerMessage(chatId, isGroup, stickerUrl) {
            const currentUser = DB.getCurrentUser();
            const newMessage = {
                id: 'm_' + Math.random().toString(36).substr(2, 7),
                senderId: currentUser.id,
                senderName: currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'sticker',
                stickerUrl: stickerUrl,
                timestamp: Date.now()
            };

            let messages = DB.getMessages();
            messages.push(newMessage);
            DB.saveMessages(messages);

            isStickersOpen = false;
            renderApp();
            scrollToBottom();
        }

        function openChat(chatId, isGroup) {
            activeChatId = chatId;
            isStickersOpen = false;
            renderApp();
            scrollToBottom();
        }

        function closeActiveChat() {
            activeChatId = null;
            isStickersOpen = false;
            renderApp();
        }

        function handleSendMessage(e, chatId, isGroup) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const currentUser = DB.getCurrentUser();
            const newMessage = {
                id: 'm_' + Math.random().toString(36).substr(2, 7),
                senderId: currentUser.id,
                senderName: currentUser.name,
                chatId: chatId,
                isGroup: isGroup,
                type: 'text',
                text: text,
                timestamp: Date.now()
            };

            let messages = DB.getMessages();
            messages.push(newMessage);
            DB.saveMessages(messages);

            input.value = '';
            renderApp();
            scrollToBottom();
        }

        function startCall(peerName, type) {
            activeCall = { peerName, type, status: 'calling' };
            renderApp();
            setTimeout(() => {
                if (activeCall) {
                    activeCall.status = 'connected';
                    renderApp();
                }
            }, 2500);
        }

        function endCall() {
            activeCall = null;
            renderApp();
        }

        function renderCallModal() {
            return `
                <div class="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
                    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center text-white shadow-2xl">
                        <div class="w-24 h-24 bg-gradient-to-tr from-brand-500 to-emerald-400 rounded-full mx-auto flex items-center justify-center text-3xl font-bold mb-4 shadow-lg animate-pulse">
                            <i class="fa-solid ${activeCall.type === 'video' ? 'fa-video' : 'fa-phone'}"></i>
                        </div>
                        <h3 class="font-bold text-lg mb-1">${escapeHtml(activeCall.peerName)}</h3>
                        <p class="text-xs text-slate-400 mb-8">${activeCall.status === 'calling' ? 'Вызов...' : 'Разговор идет (Симуляция)'}</p>
                        
                        <div class="flex justify-center space-x-4">
                            <button onclick="endCall()" class="w-14 h-14 bg-red-500 hover:bg-red-600 rounded-full flex items-center justify-center text-xl shadow-lg transition">
                                <i class="fa-solid fa-phone-slash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            activeTab = tab;
            if (tab !== 'chats') activeChatId = null;
            isStickersOpen = false;
            renderApp();
        }

        function getConversationMessages(userId, chatId, isGroup) {
            const messages = DB.getMessages();
            if (isGroup) {
                return messages.filter(m => m.chatId === chatId).sort((a,b) => a.timestamp - b.timestamp);
            } else {
                return messages.filter(m => !m.isGroup && 
                    ((m.senderId === userId && m.chatId === chatId) || (m.senderId === chatId && m.chatId === userId))
                ).sort((a,b) => a.timestamp - b.timestamp);
            }
        }

        function getLastDirectMessage(userId, friendId) {
            const msgs = DB.getMessages().filter(m => !m.isGroup && 
                ((m.senderId === userId && m.chatId === friendId) || (m.senderId === friendId && m.chatId === userId))
            );
            return msgs.length > 0 ? msgs[msgs.length - 1] : null;
        }

        function getLastGroupMessage(groupId) {
            const msgs = DB.getMessages().filter(m => m.isGroup && m.chatId === groupId);
            return msgs.length > 0 ? msgs[msgs.length - 1] : null;
        }

        function scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function renderToast(notification) {
            return `
                <div class="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-800">
                    <i class="fa-solid fa-circle-check text-brand-500 text-xl"></i>
                    <span class="text-sm font-medium">${escapeHtml(notification.text)}</span>
                </div>
            `;
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
