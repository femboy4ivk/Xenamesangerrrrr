<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xena Messenger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #c084fc; }
    </style>
</head>
<body class="bg-[#f4f0fa] h-screen overflow-hidden flex flex-col text-slate-800">

    <!-- ЭКРАН АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
    <div id="auth-screen" class="fixed inset-0 bg-[#efe7fb] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-purple-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-purple-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-purple-200 mb-3">
                    X
                </div>
                <h1 class="text-2xl font-bold text-purple-900">Xena Messenger</h1>
                <p class="text-sm text-purple-600/70 mt-1">Общайтесь легко и безопасно</p>
            </div>

            <!-- Табы переключения -->
            <div class="flex bg-purple-50 p-1 rounded-xl mb-6">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-purple-700 shadow-sm transition-all">Вход</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-sm font-semibold rounded-lg text-purple-600/70 hover:text-purple-700 transition-all">Регистрация</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-purple-800 mb-1">Ваше имя</label>
                    <input type="text" id="reg-name" placeholder="Иван Иванов" class="w-full px-4 py-3 rounded-xl bg-purple-50/50 border border-purple-200 focus:outline-none focus:border-purple-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-purple-800 mb-1">Электронная почта</label>
                    <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl bg-purple-50/50 border border-purple-200 focus:outline-none focus:border-purple-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-purple-800 mb-1">Пароль</label>
                    <input type="password" id="auth-pass" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-purple-50/50 border border-purple-200 focus:outline-none focus:border-purple-600 text-sm">
                </div>
                <button type="submit" id="auth-btn" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl shadow-md shadow-purple-200 transition-all mt-2">
                    Войти в Xena
                </button>
            </form>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС МЕССЕНДЖЕРА -->
    <div id="app-screen" class="flex h-full w-full max-w-[1600px] mx-auto bg-white shadow-2xl overflow-hidden relative">
        
        <!-- САЙДБАР (СПИСОК ЧАТОВ) -->
        <div id="sidebar" class="w-full md:w-80 lg:w-96 bg-white border-r border-purple-100 flex flex-col h-full z-20 absolute md:relative inset-y-0 left-0 transition-transform duration-300">
            <!-- Шапка сайдбара -->
            <div class="p-4 border-b border-purple-100 flex items-center justify-between bg-purple-50/30">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-purple-600 text-white font-bold flex items-center justify-center shadow-md shadow-purple-200" id="user-avatar-initials">
                        U
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-purple-900" id="current-user-name">Пользователь</h3>
                        <span class="text-xs text-emerald-600 font-medium flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> в сети</span>
                    </div>
                </div>
                <button onclick="logout()" title="Выйти" class="text-purple-400 hover:text-red-500 p-2 rounded-xl hover:bg-purple-50 transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>

            <!-- Поиск -->
            <div class="p-3 border-b border-purple-100">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-purple-400 text-sm"></i>
                    <input type="text" id="search-contact" oninput="filterContacts(this.value)" placeholder="Поиск среди контактов..." class="w-full pl-10 pr-4 py-2 bg-purple-50/50 rounded-xl text-sm border border-purple-200/60 focus:outline-none focus:border-purple-600">
                </div>
            </div>

            <!-- Список контактов -->
            <div id="contacts-list" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-purple-50">
                <!-- Заполняется JS -->
            </div>
        </div>

        <!-- ОКНО ЧАТА -->
        <div id="chat-area" class="flex-1 flex flex-col h-full bg-[#fcfbfe] relative w-full">
            <!-- Шапка чата -->
            <div class="p-3.5 border-b border-purple-100 bg-white flex items-center justify-between shadow-xs z-10">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-purple-600 p-1.5 rounded-lg hover:bg-purple-50">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="relative">
                        <img id="active-chat-avatar" src="" class="w-10 h-10 rounded-full object-cover border border-purple-200" alt="">
                        <span id="active-chat-status-dot" class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-white"></span>
                    </div>
                    <div>
                        <h4 id="active-chat-name" class="font-bold text-sm text-purple-900">Выберите чат</h4>
                        <span id="active-chat-status" class="text-xs text-purple-600/60 font-medium">онлайн</span>
                    </div>
                </div>
                
                <!-- Кнопки звонков -->
                <div class="flex items-center space-x-1 sm:space-x-2">
                    <button onclick="startCall('audio')" class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-600 hover:text-white transition-all flex items-center justify-center shadow-sm" title="Голосовой звонок">
                        <i class="fa-solid fa-phone text-sm"></i>
                    </button>
                    <button onclick="startCall('video')" class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-600 hover:text-white transition-all flex items-center justify-center shadow-sm" title="Видеозвонок">
                        <i class="fa-solid fa-video text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Сообщения -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar flex flex-col">
                <!-- Заполняется JS -->
            </div>

            <!-- Панель ввода -->
            <div class="p-3 bg-white border-t border-purple-100 flex items-center space-x-2">
                <button class="text-purple-400 hover:text-purple-600 p-2.5 rounded-xl hover:bg-purple-50 transition-colors">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                </button>
                <input type="text" id="message-input" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="Написать сообщение в Xena..." class="flex-1 bg-purple-50/50 border border-purple-200/60 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-600">
                <button onclick="sendMessage()" class="bg-purple-600 hover:bg-purple-700 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-md shadow-purple-200 transition-all">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЗВОНКА (WebRTC) -->
    <div id="call-modal" class="fixed inset-0 bg-purple-950/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col border border-purple-200">
            <!-- Заголовок звонка -->
            <div class="p-4 bg-purple-900 text-white flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i id="call-type-icon" class="fa-solid fa-video text-purple-300"></i>
                    <span id="call-title" class="font-semibold text-sm">Видеозвонок с Аной</span>
                </div>
                <span id="call-timer" class="text-xs bg-purple-800 px-2.5 py-1 rounded-full font-mono">00:00</span>
            </div>

            <!-- Область видео потоков -->
            <div class="relative bg-black w-full h-80 sm:h-96 flex items-center justify-center overflow-hidden">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <!-- Локальное видео (картинка в картинке) -->
                <div class="absolute bottom-4 right-4 w-28 h-36 sm:w-36 sm:h-48 bg-slate-900 rounded-xl overflow-hidden border-2 border-purple-500 shadow-lg">
                    <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                </div>
                <!-- Заглушка если камера отключена -->
                <div id="call-avatar-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-purple-950 text-white hidden">
                    <div class="w-24 h-24 rounded-full bg-purple-600 flex items-center justify-center text-4xl font-bold shadow-xl mb-3">
                        А
                    </div>
                    <p class="text-sm font-medium text-purple-200">Установка безопасного соединения Xena...</p>
                </div>
            </div>

            <!-- Управление звонком -->
            <div class="p-4 bg-purple-50 flex items-center justify-center space-x-4">
                <button onclick="toggleAudio()" id="mic-btn" class="w-12 h-12 rounded-2xl bg-white text-purple-700 shadow-md hover:bg-purple-100 flex items-center justify-center transition-all">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>
                <button onclick="endCall()" class="w-14 h-14 rounded-2xl bg-red-500 text-white shadow-lg shadow-red-200 hover:bg-red-600 flex items-center justify-center transition-all" title="Завершить">
                    <i class="fa-solid fa-phone-slash text-xl"></i>
                </button>
                <button onclick="toggleVideoCam()" id="cam-btn" class="w-12 h-12 rounded-2xl bg-white text-purple-700 shadow-md hover:bg-purple-100 flex items-center justify-center transition-all">
                    <i class="fa-solid fa-video text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- JS СКРИПТЫ -->
    <script>
        // База данных контактов
        let contacts = [
            { id: 1, name: 'Ана Соколова', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150', status: 'онлайн', messages: [
                { sender: 'them', text: 'Привет! Как тестируется твой новый мессенджер Xena?', time: '10:42' },
                { sender: 'me', text: 'Привет! Дизайн потрясающий, светлый фиолетовый просто супер.', time: '10:45' }
            ]},
            { id: 2, name: 'Максим Технарь', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150', status: 'был(а) недавно', messages: [
                { sender: 'them', text: 'Звонки через WebRTC работают отлично?', time: 'Вчера' }
            ]},
            { id: 3, name: 'Елена Руководитель', avatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=150', status: 'онлайн', messages: [
                { sender: 'them', text: 'Жду презентацию проекта на GitHub!', time: '12:00' }
            ]}
        ];

        let activeChatId = 1;
        let currentUser = null;
        let localStream = null;
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let isMicMuted = false;
        let isCamOff = false;

        // Инициализация при загрузке
        window.onload = () => {
            const savedUser = localStorage.getItem('xena_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initApp();
            }
        };

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tab-login').className = `flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${isLogin ? 'bg-white text-purple-700 shadow-sm' : 'text-purple-600/70 hover:text-purple-700'}`;
            document.getElementById('tab-register').className = `flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${!isLogin ? 'bg-white text-purple-700 shadow-sm' : 'text-purple-600/70 hover:text-purple-700'}`;
            document.getElementById('name-field').classList.toggle('hidden', isLogin);
            document.getElementById('auth-btn').innerText = isLogin ? 'Войти в Xena' : 'Зарегистрироваться';
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const nameInput = document.getElementById('reg-name').value;
            const isReg = !document.getElementById('name-field').classList.contains('hidden');

            currentUser = {
                name: isReg && nameInput ? nameInput : email.split('@')[0],
                email: email
            };
            localStorage.setItem('xena_user', JSON.stringify(currentUser));
            initApp();
        }

        function initApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('current-user-name').innerText = currentUser.name;
            document.getElementById('user-avatar-initials').innerText = currentUser.name.charAt(0).toUpperCase();
            renderContacts();
            selectChat(contacts[0].id);
        }

        function logout() {
            localStorage.removeItem('xena_user');
            location.reload();
        }

        function renderContacts(filter = '') {
            const list = document.getElementById('contacts-list');
            list.innerHTML = '';
            
            contacts.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(contact => {
                const lastMsg = contact.messages[contact.messages.length - 1] || { text: 'Нет сообщений', time: '' };
                const isActive = contact.id === activeChatId;
                
                const div = document.createElement('div');
                div.className = `p-3.5 flex items-center space-x-3 cursor-pointer transition-colors ${isActive ? 'bg-purple-100/70' : 'hover:bg-purple-50/50'}`;
                div.onclick = () => selectChat(contact.id);
                div.innerHTML = `
                    <div class="relative">
                        <img src="${contact.avatar}" class="w-12 h-12 rounded-full object-cover border border-purple-200" alt="">
                        <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full ${contact.status === 'онлайн' ? 'bg-emerald-500' : 'bg-slate-300'} border-2 border-white"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h4 class="font-bold text-sm text-purple-900 truncate">${contact.name}</h4>
                            <span class="text-[10px] text-purple-600/60">${lastMsg.time}</span>
                        </div>
                        <p class="text-xs text-purple-700/70 truncate">${lastMsg.text}</p>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterContacts(val) {
            renderContacts(val);
        }

        function selectChat(id) {
            activeChatId = id;
            const contact = contacts.find(c => c.id === id);
            
            document.getElementById('active-chat-name').innerText = contact.name;
            document.getElementById('active-chat-avatar').src = contact.avatar;
            document.getElementById('active-chat-status').innerText = contact.status;
            
            renderMessages();
            renderContacts(document.getElementById('search-contact').value);
            
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            const contact = contacts.find(c => c.id === activeChatId);

            contact.messages.forEach(msg => {
                const isMe = msg.sender === 'me';
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-2`;
                
                wrapper.innerHTML = `
                    <div class="max-w-[75%] sm:max-w-[60%] rounded-2xl px-4 py-2.5 text-sm shadow-xs ${isMe ? 'bg-purple-600 text-white rounded-br-none' : 'bg-white text-slate-800 border border-purple-100 rounded-bl-none'}">
                        <p class="leading-relaxed break-words">${msg.text}</p>
                        <div class="text-[10px] text-right mt-1 ${isMe ? 'text-purple-200' : 'text-purple-600/50'} font-medium">${msg.time}</div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text) return;

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const contact = contacts.find(c => c.id === activeChatId);
            
            contact.messages.push({ sender: 'me', text: text, time: timeNow });
            input.value = '';
            renderMessages();
            renderContacts();

            // Автоответчик симуляция
            setTimeout(() => {
                contact.messages.push({ sender: 'them', text: 'Сообщение получено в Xena! Отличный мессенджер.', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                if(activeChatId === contact.id) {
                    renderMessages();
                    renderContacts();
                }
            }, 1500);
        }

        // РАБОЧИЕ ЗВОНКИ WebRTC
        async function startCall(type) {
            const contact = contacts.find(c => c.id === activeChatId);
            document.getElementById('call-title').innerText = `${type === 'video' ? 'Видеозвонок' : 'Голосовой звонок'}: ${contact.name}`;
            document.getElementById('call-type-icon').className = `fa-solid ${type === 'video' ? 'fa-video' : 'fa-phone'} text-purple-300`;
            document.getElementById('call-modal').classList.remove('hidden');

            secondsElapsed = 0;
            document.getElementById('call-timer').innerText = '00:00';
            callTimerInterval = setInterval(() => {
                secondsElapsed++;
                let m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                let s = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('call-timer').innerText = `${m}:${s}`;
            }, 1000);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: type === 'video',
                    audio: true
                });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('remote-video').srcObject = localStream; // Эхо для теста в одном браузере
                document.getElementById('call-avatar-placeholder').classList.add('hidden');
            } catch (err) {
                console.warn('Доступ к медиа устройствам заблокирован или отсутствует камера:', err);
                document.getElementById('call-avatar-placeholder').classList.remove('hidden');
            }
        }

        function endCall() {
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            clearInterval(callTimerInterval);
            document.getElementById('call-modal').classList.add('hidden');
        }

        function toggleAudio() {
            if(!localStream) return;
            isMicMuted = !isMicMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMicMuted);
            document.getElementById('mic-btn').className = `w-12 h-12 rounded-2xl ${isMicMuted ? 'bg-red-100 text-red-600' : 'bg-white text-purple-700'} shadow-md flex items-center justify-center transition-all`;
        }

        function toggleVideoCam() {
            if(!localStream) return;
            isCamOff = !isCamOff;
            localStream.getVideoTracks().forEach(track => track.enabled = !isCamOff);
            document.getElementById('cam-btn').className = `w-12 h-12 rounded-2xl ${isCamOff ? 'bg-red-100 text-red-600' : 'bg-white text-purple-700'} shadow-md flex items-center justify-center transition-all`;
        }
    </script>
</body>
</html>
